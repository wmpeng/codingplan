<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台可用性监控 - Coding Plan</title>
    <link rel="icon" href="/favicon.ico?v=260418" type="image/x-icon">
    <link rel="stylesheet" href="../styles/shared.css?v=260515">
    <link rel="stylesheet" href="../styles/monitor.css">
    <script src="monitor-config.js"></script>
    <script src="monitor-config.local.js"></script>
    <script src="../scripts/shared.js?v=260512"></script>
    <style>
        .monitor-page .header {
            padding: 1.15rem 1.35rem;
            margin-bottom: 1rem;
        }
        .monitor-page .header h1 {
            font-size: 1.55rem;
        }
        .monitor-page .header .subtitle {
            font-size: 0.86rem;
        }
        .monitor-page .surface-panel--padded {
            padding: 1.15rem 1.35rem 1.35rem;
        }
    </style>
</head>
<body class="monitor-page">
    <div class="container">
        <div id="pageNavMount"></div>

        <div class="header">
            <div class="header-top">
                <h1 id="pageTitle"></h1>
            </div>
        </div>

        <div class="surface-panel surface-panel--padded">
            <div id="monitorBoardRoot"></div>
        </div>
    </div>

    <script src="../scripts/monitor-board.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        renderPageNav('pageNavMount', {
            activeKey: 'monitor',
            tabs: [
                { key: 'index', href: '../index.html', id: 'navIndexTab' },
                { key: 'payg', href: '../payg.html', text: '按量计价', id: 'navPaygTab' },
                { key: 'plan-usage', href: '../plan-usage.html', id: 'navPlanUsageTab' },
                { key: 'coding-agents', href: '../coding-agents.html', id: 'navCodingAgentsTab' },
                { key: 'relays', href: '../relays.html', id: 'navRelaysTab' },
                { key: 'relay-detect', href: '../relay-detect.html', id: 'navDetectTab' },
                { key: 'monitor', href: 'index.html', text: '可用性监控' }
            ],
            settings: {
                panelTitle: '显示设置',
                ultraWideLabel: '超宽屏模式'
            }
        });

        mountMonitorBoard(document.getElementById('monitorBoardRoot'), {
            configUrl: 'monitor-config.json'
        }).then(function(cfg) {
            if (cfg && cfg.pageTitle) {
                document.getElementById('pageTitle').textContent = cfg.pageTitle;
            }
        });
    });
    </script>
</body>
</html>

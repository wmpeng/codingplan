<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<script>
(function () {
  try {
    var path = (location.pathname || '').replace(/\\/g, '/');
    var next = path.replace(/\/v2(?=\/|$)/, '');
    if (!next || next === '/') next = '/index.html';
    location.replace(next + (location.search || '') + (location.hash || ''));
  } catch (e) {}
})();
</script>
<title>Redirecting…</title>
</head>
<body>
<p>正在跳转到新版…</p>
</body>
</html>

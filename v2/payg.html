<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按量计价</title>
    <meta name="description" content="AI 平台按量调用单价对比：平台 × 模型，输入 / 缓存 / 输出价格筛选排序。">
    <link rel="icon" href="/favicon.ico?v=260418" type="image/x-icon">
    <link rel="stylesheet" href="styles/shared.css?v=260515">
    <link rel="stylesheet" href="styles/comparison-table.css?v=260722">
    <style>
        .payg-intro {
            margin: 0 0 20px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.7;
        }

        .header .subtitle {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="pageNavMount"></div>

        <div class="header">
            <h1>按量计价</h1>
            <p class="subtitle">一行 = 平台 × 模型；价格单位为元 / 百万 token；无标价显示 —</p>
        </div>

        <div id="paygPageRoot">
        <p class="payg-intro">默认按模型顺序排列；可用平台 / 模型筛选，或只看已标价行。点表头可按输入 / 缓存 / 输出 / 评分排序。峰谷与折扣说明见备注。</p>

        <div class="filter-bar surface-panel">
            <div class="filter-dropdown">
                <button type="button" class="filter-btn" id="paygVendorBtn">
                    <span>平台</span>
                    <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
                    <span class="count" id="paygVendorCount" style="display: none;">0</span>
                </button>
                <div class="dropdown-menu" id="paygVendorDropdown">
                    <div class="dropdown-section">
                        <div class="checkbox-group" id="paygVendorCheckboxes"></div>
                    </div>
                    <div class="dropdown-actions">
                        <button type="button" class="dropdown-btn secondary" id="paygVendorReset">重置</button>
                        <button type="button" class="dropdown-btn primary" id="paygVendorDone">确定</button>
                    </div>
                </div>
            </div>

            <div class="filter-dropdown">
                <button type="button" class="filter-btn" id="paygModelBtn">
                    <span>模型</span>
                    <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
                    <span class="count" id="paygModelCount" style="display: none;">0</span>
                </button>
                <div class="dropdown-menu" id="paygModelDropdown">
                    <div class="dropdown-section">
                        <div class="checkbox-group" id="paygModelCheckboxes"></div>
                    </div>
                    <div class="dropdown-actions">
                        <button type="button" class="dropdown-btn secondary" id="paygModelReset">重置</button>
                        <button type="button" class="dropdown-btn primary" id="paygModelDone">确定</button>
                    </div>
                </div>
            </div>

            <div class="filter-checkbox">
                <label class="checkbox-label">
                    <input type="checkbox" id="paygPricedOnly">
                    <span class="checkbox-text">仅显示有标价</span>
                </label>
            </div>

            <button type="button" class="reset-btn" id="paygClearFilters">重置筛选</button>

            <div class="stats-bar">
                显示 <strong id="paygResultCount">0</strong> / <strong id="paygTotalCount">0</strong> 行
            </div>
        </div>

        <div class="table-wrapper surface-panel">
            <div class="table-watermark" id="paygTableWatermark" aria-hidden="true">
                <div class="table-watermark-line"></div>
                <div class="table-watermark-line"></div>
                <div class="table-watermark-line"></div>
            </div>
            <div class="table-scroll" id="paygTableScroll">
                <table id="paygTable">
                    <thead>
                        <tr>
                            <th class="sticky-first">平台</th>
                            <th class="sticky-second">模型</th>
                            <th class="sortable" data-sort-key="input">输入</th>
                            <th class="sortable" data-sort-key="cache">缓存</th>
                            <th class="sortable" data-sort-key="output">输出</th>
                            <th>备注</th>
                            <th class="sortable" data-sort-key="rating">评分</th>
                        </tr>
                    </thead>
                    <tbody id="paygTableBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="empty-state-text">加载中…</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        </div>
    </div>

    <script src="scripts/shared.js?v=260722"></script>
    <script src="scripts/platform-catalog.js?v=260722"></script>
    <script src="scripts/payg.js?v=260722"></script>
</body>
</html>

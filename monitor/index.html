<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台可用性监控 - Coding Plan</title>
    <link rel="icon" href="/favicon.ico?v=260418" type="image/x-icon">
    <link rel="stylesheet" href="../styles/shared.css?v=260515">
    <script src="monitor-config.local.js"></script>
    <script src="monitor-config.js"></script>
    <script src="../scripts/shared.js?v=260512"></script>
    <style>
        .monitor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.25rem;
            align-items: center;
            padding-bottom: 1rem;
            margin-bottom: 0.25rem;
            border-bottom: 1px solid var(--border-light);
        }
        .monitor-toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.84rem;
            color: var(--text-secondary);
        }
        .monitor-toolbar select {
            padding: 0.35rem 0.65rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            color: var(--text-primary);
            font-size: 0.84rem;
        }
        .monitor-toolbar input[type="checkbox"] {
            accent-color: var(--accent-primary);
        }
        .monitor-list {
            display: flex;
            flex-direction: column;
        }
        .monitor-section-head {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0 0.85rem;
        }
        .monitor-section-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .monitor-section-count {
            font-size: 0.82rem;
            color: var(--text-tertiary);
        }
        .monitor-row {
            padding: 0.95rem 0;
            border-bottom: 1px solid var(--border-light);
        }
        .monitor-row:last-child {
            border-bottom: none;
        }
        .monitor-row--nested {
            padding: 0.75rem 0;
        }
        .monitor-platform {
            border-bottom: 1px solid var(--border-light);
        }
        .monitor-platform > .monitor-row {
            border-bottom: none;
        }
        .monitor-models .monitor-row--nested {
            border-bottom: none;
            border-top: 1px solid var(--border-light);
        }
        .monitor-models .monitor-row--nested:first-child {
            border-top: none;
        }
        .monitor-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }
        .monitor-row-top--clickable {
            cursor: pointer;
        }
        .monitor-row-title {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            min-width: 0;
            flex: 1;
            flex-wrap: wrap;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot--green { background: #2f9e76; }
        .status-dot--yellow { background: #d4a017; }
        .status-dot--red { background: #dc6b5a; }
        .status-dot--gray { background: #c8cdd6; }
        .monitor-name {
            font-weight: 500;
            font-size: 0.92rem;
            color: var(--text-primary);
        }
        .monitor-name-sub {
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 400;
        }
        .monitor-meta {
            color: var(--text-tertiary);
            font-size: 0.8rem;
        }
        .monitor-rate {
            font-size: 0.82rem;
            color: var(--text-tertiary);
            white-space: nowrap;
        }
        .monitor-chevron {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid var(--text-tertiary);
            margin-left: 0.15rem;
            transition: transform 0.15s ease;
        }
        .monitor-chevron--open {
            transform: rotate(180deg);
        }
        .monitor-bar {
            display: flex;
            gap: 2px;
            width: 100%;
            height: 34px;
        }
        .timeline-cell {
            flex: 1 1 0;
            min-width: 2px;
            height: 100%;
            border-radius: 2px;
        }
        .timeline-cell--green { background: #2f9e76; }
        .timeline-cell--yellow { background: #d4a017; }
        .timeline-cell--red { background: #dc6b5a; }
        .timeline-cell--gray { background: #e8ecf1; }
        .monitor-models {
            margin-top: 0.15rem;
            padding-left: 1.1rem;
        }
        .monitor-loading,
        .monitor-empty {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }
        .monitor-tooltip {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            background: rgba(23, 32, 51, 0.94);
            color: #fff;
            font-size: 12px;
            line-height: 1.4;
            padding: 7px 10px;
            border-radius: 8px;
            white-space: nowrap;
            display: none;
            box-shadow: var(--shadow-md);
        }
        @media (max-width: 640px) {
            .monitor-row-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.35rem;
            }
            .monitor-rate {
                padding-left: 1.25rem;
            }
        }
        .monitor-page .header {
            padding: 1.15rem 1.35rem;
            margin-bottom: 1rem;
        }
        .monitor-page .header h1 {
            font-size: 1.55rem;
        }
        .monitor-page .header .subtitle {
            font-size: 0.86rem;
        }
        .monitor-page .surface-panel--padded {
            padding: 1.15rem 1.35rem 1.35rem;
        }
    </style>
</head>
<body class="monitor-page">
    <div class="container">
        <div id="pageNavMount"></div>

        <div class="header">
            <div class="header-top">
                <h1 id="pageTitle"></h1>
            </div>
            <div id="headerSubtitle" class="subtitle"></div>
        </div>

        <div class="surface-panel surface-panel--padded">
            <div class="monitor-toolbar">
                <label>
                    <span id="modelLabel"></span>
                    <select id="modelFilter"></select>
                </label>
                <label>
                    <input type="checkbox" id="sortByAvailability">
                    <span id="sortLabel"></span>
                </label>
            </div>
            <div id="boardRoot" class="monitor-loading">加载中...</div>
        </div>
    </div>

    <div id="monitorTooltip" class="monitor-tooltip"></div>

    <script>
    (function() {
        'use strict';

        var API_BASE = (window.MONITOR_CONFIG && window.MONITOR_CONFIG.apiBase) || '';
        var CONFIG = {};
        var boardData = null;
        var expandedPlatforms = {};
        var tooltipEl = document.getElementById('monitorTooltip');

        function pickVisibleCount() {
            var targets = CONFIG.responsiveCells || [120, 72, 24];
            var width = window.innerWidth || 1200;
            if (width >= 1100) return targets[0];
            if (width >= 720) return targets[1];
            return targets[2];
        }

        function visibleHours(hours) {
            var count = pickVisibleCount();
            if (!hours || hours.length <= count) return hours || [];
            return hours.slice(hours.length - count);
        }

        function displayModelName(name) {
            if (!boardData || !boardData.model_display_names) return name;
            return boardData.model_display_names[name] || name;
        }

        function formatRate(rate) {
            return ((rate || 0) * 100).toFixed(1) + '%';
        }

        function formatTps(value) {
            if (value === null || value === undefined) return '—';
            return String(value);
        }

        function formatHourTooltip(hourMs, cell) {
            var d = new Date(hourMs);
            var datePart = (d.getMonth() + 1) + '/' + d.getDate();
            var timePart = String(d.getHours()).padStart(2, '0') + ':00';
            var parts = [datePart + ' ' + timePart];
            if (cell.success_rate !== null && cell.success_rate !== undefined) {
                parts.push('成功率 ' + (cell.success_rate * 100).toFixed(1) + '%');
            }
            if (cell.avg_tps !== null && cell.avg_tps !== undefined) {
                parts.push(cell.avg_tps + ' ' + (CONFIG.toolbar.tpsUnit || 'tok/s'));
            }
            return parts.join(' · ');
        }

        function formatRateDisplay(rate) {
            return formatRate(rate) + ' ' + (CONFIG.toolbar.availableLabel || '可用');
        }

        function statusDotColor(hours) {
            var cells = visibleHours(hours);
            if (!cells.length) return 'gray';
            return cells[cells.length - 1].color || 'gray';
        }

        function showTooltip(text, event) {
            tooltipEl.textContent = text;
            tooltipEl.style.display = 'block';
            tooltipEl.style.left = (event.clientX + 12) + 'px';
            tooltipEl.style.top = (event.clientY + 12) + 'px';
        }

        function hideTooltip() {
            tooltipEl.style.display = 'none';
        }

        function renderTimelineBar(hours) {
            var bar = document.createElement('div');
            bar.className = 'monitor-bar';
            visibleHours(hours).forEach(function(cell) {
                var el = document.createElement('div');
                el.className = 'timeline-cell timeline-cell--' + (cell.color || 'gray');
                el.addEventListener('mouseenter', function(e) {
                    showTooltip(formatHourTooltip(cell.hour_ms, cell), e);
                });
                el.addEventListener('mousemove', function(e) {
                    showTooltip(formatHourTooltip(cell.hour_ms, cell), e);
                });
                el.addEventListener('mouseleave', hideTooltip);
                bar.appendChild(el);
            });
            return bar;
        }

        function renderStatusRow(options) {
            options = options || {};
            var row = document.createElement('div');
            row.className = 'monitor-row' + (options.nested ? ' monitor-row--nested' : '');

            var top = document.createElement('div');
            top.className = 'monitor-row-top' + (options.clickable ? ' monitor-row-top--clickable' : '');
            if (options.onClick) {
                top.addEventListener('click', options.onClick);
            }

            var title = document.createElement('div');
            title.className = 'monitor-row-title';

            var dot = document.createElement('span');
            dot.className = 'status-dot status-dot--' + statusDotColor(options.hours);
            title.appendChild(dot);

            if (options.compactPlatformName) {
                var platformName = document.createElement('span');
                platformName.className = 'monitor-name';
                platformName.textContent = options.compactPlatformName;
                var modelPart = document.createElement('span');
                modelPart.className = 'monitor-name-sub';
                modelPart.textContent = ' · ' + options.title;
                title.appendChild(platformName);
                title.appendChild(modelPart);
            } else {
                var nameEl = document.createElement('span');
                nameEl.className = 'monitor-name';
                nameEl.textContent = options.title;
                title.appendChild(nameEl);
            }

            if (options.meta) {
                var meta = document.createElement('span');
                meta.className = 'monitor-meta';
                meta.textContent = options.meta;
                title.appendChild(meta);
            }

            if (options.expanded !== undefined) {
                var chevron = document.createElement('span');
                chevron.className = 'monitor-chevron' + (options.expanded ? ' monitor-chevron--open' : '');
                title.appendChild(chevron);
            }

            var rate = document.createElement('span');
            rate.className = 'monitor-rate';
            rate.textContent = formatRateDisplay(options.rate);

            top.appendChild(title);
            top.appendChild(rate);
            row.appendChild(top);
            row.appendChild(renderTimelineBar(options.hours));
            return row;
        }

        function renderModelBlock(model, opts) {
            opts = opts || {};
            return renderStatusRow({
                nested: true,
                compactPlatformName: opts.compactPlatformName || null,
                title: displayModelName(model.standard_model_name),
                meta: formatTps(model.avg_tps) + ' ' + (CONFIG.toolbar.tpsUnit || 'tok/s'),
                rate: model.availability_rate,
                hours: model.hours
            });
        }

        function renderPlatformBlock(platform) {
            var block = document.createElement('div');
            block.className = 'monitor-platform';

            block.appendChild(renderStatusRow({
                title: platform.platform_display_name || platform.platform_name,
                meta: (platform.models ? platform.models.length : 0) + ' ' + (CONFIG.toolbar.modelsLabel || '个模型'),
                rate: platform.availability_rate,
                hours: platform.hours,
                clickable: true,
                expanded: !!expandedPlatforms[platform.platform_name],
                onClick: function() {
                    expandedPlatforms[platform.platform_name] = !expandedPlatforms[platform.platform_name];
                    renderBoard();
                }
            }));

            if (expandedPlatforms[platform.platform_name] && platform.models && platform.models.length) {
                var modelsWrap = document.createElement('div');
                modelsWrap.className = 'monitor-models';
                platform.models.forEach(function(model) {
                    modelsWrap.appendChild(renderModelBlock(model));
                });
                block.appendChild(modelsWrap);
            }

            return block;
        }

        function renderSectionHead(label, count) {
            var head = document.createElement('div');
            head.className = 'monitor-section-head';
            var title = document.createElement('span');
            title.className = 'monitor-section-title';
            title.textContent = label;
            var meta = document.createElement('span');
            meta.className = 'monitor-section-count';
            meta.textContent = count;
            head.appendChild(title);
            head.appendChild(meta);
            return head;
        }

        function collectModelOptions(platforms) {
            var set = {};
            (platforms || []).forEach(function(platform) {
                (platform.models || []).forEach(function(model) {
                    set[model.standard_model_name] = true;
                });
            });
            return Object.keys(set).sort();
        }

        function sortedPlatforms(platforms, sortByAvailability) {
            var copy = (platforms || []).slice();
            if (!sortByAvailability) return copy;
            copy.sort(function(a, b) {
                return (b.availability_rate || 0) - (a.availability_rate || 0);
            });
            return copy;
        }

        function renderBoard() {
            var root = document.getElementById('boardRoot');
            root.innerHTML = '';
            root.className = 'monitor-list';

            if (!boardData || !boardData.platforms || !boardData.platforms.length) {
                root.className = 'monitor-empty';
                root.textContent = CONFIG.emptyLabel || '暂无数据';
                return;
            }

            var selectedModel = document.getElementById('modelFilter').value;
            var sortByAvailability = document.getElementById('sortByAvailability').checked;

            if (selectedModel) {
                var rows = [];
                sortedPlatforms(boardData.platforms, sortByAvailability).forEach(function(platform) {
                    (platform.models || []).forEach(function(model) {
                        if (model.standard_model_name !== selectedModel) return;
                        rows.push({
                            platform: platform,
                            model: model
                        });
                    });
                });
                if (!rows.length) {
                    root.className = 'monitor-empty';
                    root.textContent = CONFIG.emptyLabel || '暂无数据';
                    return;
                }
                if (sortByAvailability) {
                    rows.sort(function(a, b) {
                        return (b.model.availability_rate || 0) - (a.model.availability_rate || 0);
                    });
                }
                root.appendChild(renderSectionHead(
                    displayModelName(selectedModel),
                    rows.length + ' 个平台'
                ));
                rows.forEach(function(row) {
                    root.appendChild(renderModelBlock(row.model, {
                        compactPlatformName: row.platform.platform_display_name || row.platform.platform_name
                    }));
                });
                return;
            }

            var platforms = sortedPlatforms(boardData.platforms, sortByAvailability);
            root.appendChild(renderSectionHead('平台', platforms.length + ' 个'));
            platforms.forEach(function(platform) {
                root.appendChild(renderPlatformBlock(platform));
            });
        }

        function populateModelFilter(platforms) {
            var select = document.getElementById('modelFilter');
            var current = select.value || '';
            select.innerHTML = '';
            var allOpt = document.createElement('option');
            allOpt.value = '';
            allOpt.textContent = CONFIG.toolbar.allModels || '全部';
            select.appendChild(allOpt);

            collectModelOptions(platforms).forEach(function(name) {
                var opt = document.createElement('option');
                opt.value = name;
                opt.textContent = displayModelName(name);
                select.appendChild(opt);
            });

            if (current && collectModelOptions(platforms).indexOf(current) >= 0) {
                select.value = current;
            }
        }

        function fetchBoard() {
            var root = document.getElementById('boardRoot');
            root.className = 'monitor-loading';
            root.textContent = CONFIG.loadingLabel || '加载中...';

            fetch(API_BASE + '/monitor/board?days=5')
                .then(function(r) { return r.json(); })
                .then(function(resp) {
                    boardData = (resp && resp.data) || resp;
                    populateModelFilter(boardData.platforms || []);
                    renderBoard();
                })
                .catch(function() {
                    root.className = 'monitor-empty';
                    root.textContent = CONFIG.errorLabel || '数据加载失败，请稍后重试';
                });
        }

        function loadPageConfig() {
            return fetch('monitor-config.json')
                .then(function(r) { return r.json(); })
                .then(function(cfg) { CONFIG = cfg; })
                .catch(function() { CONFIG = {}; });
        }

        function applyStaticTexts() {
            document.getElementById('pageTitle').textContent = CONFIG.pageTitle || '平台可用性监控';
            document.getElementById('headerSubtitle').textContent = (CONFIG.header && CONFIG.header.subtitle) || '';
            document.getElementById('modelLabel').textContent = (CONFIG.toolbar && CONFIG.toolbar.modelLabel) || '模型';
            document.getElementById('sortLabel').textContent = (CONFIG.toolbar && CONFIG.toolbar.sortByAvailability) || '按可用率排序';
        }

        document.getElementById('modelFilter').addEventListener('change', renderBoard);
        document.getElementById('sortByAvailability').addEventListener('change', renderBoard);
        window.addEventListener('resize', renderBoard);

        document.addEventListener('DOMContentLoaded', function() {
            renderPageNav('pageNavMount', {
                activeKey: 'monitor',
                tabs: [
                    { key: 'index', href: '../index.html', id: 'navIndexTab' },
                    { key: 'plan-usage', href: '../plan-usage.html', id: 'navPlanUsageTab' },
                    { key: 'coding-agents', href: '../coding-agents.html', id: 'navCodingAgentsTab' },
                    { key: 'relays', href: '../relays.html', id: 'navRelaysTab' },
                    { key: 'relay-detect', href: '../relay-detect.html', id: 'navDetectTab' },
                    { key: 'monitor', href: 'index.html', text: '可用性监控' }
                ],
                settings: {
                    panelTitle: '显示设置',
                    ultraWideLabel: '超宽屏模式'
                }
            });

            loadPageConfig().then(function() {
                applyStaticTexts();
                fetchBoard();
            });
        });
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台可用性监控 - Coding Plan</title>
    <link rel="icon" href="/favicon.ico?v=260418" type="image/x-icon">
    <link rel="stylesheet" href="../styles/shared.css?v=260515">
    <script src="monitor-config.js"></script>
    <script src="monitor-config.local.js"></script>
    <script src="../scripts/shared.js?v=260512"></script>
    <style>
        .monitor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            padding-bottom: 0.85rem;
            margin-bottom: 0.15rem;
        }
        .monitor-control {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.38rem 0.75rem;
            border-radius: 999px;
            background: rgba(23, 32, 51, 0.04);
            font-size: 0.82rem;
            color: var(--text-tertiary);
        }
        .monitor-control-label {
            white-space: nowrap;
        }
        .monitor-dropdown {
            position: relative;
        }
        .monitor-dropdown-trigger {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.82rem;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
            line-height: 1.2;
        }
        .monitor-dropdown-trigger:hover {
            color: var(--accent-primary);
        }
        .monitor-dropdown-value {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .monitor-dropdown-chevron {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid var(--text-tertiary);
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }
        .monitor-dropdown.is-open .monitor-dropdown-chevron {
            transform: rotate(180deg);
        }
        .monitor-control:has(.monitor-dropdown.is-open) {
            background: #fff;
            box-shadow: 0 4px 18px rgba(23, 32, 51, 0.08);
        }
        .monitor-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: -0.35rem;
            z-index: 60;
            min-width: 200px;
            max-width: 300px;
            max-height: 280px;
            overflow-y: auto;
            padding: 0.35rem;
            background: #fff;
            border: 1px solid rgba(23, 32, 51, 0.08);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(23, 32, 51, 0.12), 0 2px 8px rgba(23, 32, 51, 0.06);
            display: none;
        }
        .monitor-dropdown.is-open .monitor-dropdown-menu {
            display: block;
        }
        .monitor-dropdown-option {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            padding: 0.52rem 0.7rem;
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--text-primary);
            cursor: pointer;
            font-family: inherit;
            line-height: 1.35;
            transition: background 0.12s ease, color 0.12s ease;
        }
        .monitor-dropdown-option:hover {
            background: rgba(23, 32, 51, 0.04);
        }
        .monitor-dropdown-option.is-selected {
            background: rgba(47, 158, 118, 0.1);
            color: #1f7a5c;
            font-weight: 500;
        }
        .monitor-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0;
            padding: 0.38rem 0.75rem;
            border-radius: 999px;
            background: rgba(23, 32, 51, 0.04);
            border: 1px solid transparent;
            cursor: pointer;
            user-select: none;
            font-size: 0.82rem;
            color: var(--text-tertiary);
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .monitor-toggle:hover {
            background: rgba(23, 32, 51, 0.06);
            color: var(--text-secondary);
        }
        .monitor-toggle.is-active {
            background: rgba(47, 158, 118, 0.1);
            color: #1f7a5c;
            border-color: rgba(47, 158, 118, 0.18);
        }
        .monitor-toggle input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .monitor-list {
            display: flex;
            flex-direction: column;
        }
        .monitor-section-head {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0 0.85rem;
        }
        .monitor-section-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .monitor-section-count {
            font-size: 0.82rem;
            color: var(--text-tertiary);
        }
        .monitor-row {
            padding: 0.95rem 0;
            border-bottom: 1px solid var(--border-light);
        }
        .monitor-row:last-child {
            border-bottom: none;
        }
        .monitor-row--nested {
            padding: 0.75rem 0;
        }
        .monitor-platform {
            border-bottom: 1px solid var(--border-light);
        }
        .monitor-platform > .monitor-row {
            border-bottom: none;
        }
        .monitor-models .monitor-row--nested {
            border-bottom: none;
            border-top: 1px solid var(--border-light);
        }
        .monitor-models .monitor-row--nested:first-child {
            border-top: none;
        }
        .monitor-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }
        .monitor-row-top--clickable {
            cursor: pointer;
        }
        .monitor-row-title {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            min-width: 0;
            flex: 1;
            flex-wrap: wrap;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot--green { background: #2f9e76; }
        .status-dot--yellow { background: #d4a017; }
        .status-dot--red { background: #dc6b5a; }
        .status-dot--gray { background: #c8cdd6; }
        .monitor-name {
            font-weight: 500;
            font-size: 0.92rem;
            color: var(--text-primary);
        }
        .monitor-name-sub {
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 400;
        }
        .monitor-meta {
            color: var(--text-tertiary);
            font-size: 0.8rem;
        }
        .monitor-rate {
            font-size: 0.82rem;
            color: var(--text-tertiary);
            white-space: nowrap;
        }
        .monitor-chevron {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid var(--text-tertiary);
            margin-left: 0.15rem;
            transition: transform 0.15s ease;
        }
        .monitor-chevron--open {
            transform: rotate(180deg);
        }
        .monitor-bar {
            display: flex;
            gap: 2px;
            width: 100%;
            height: 34px;
        }
        .timeline-cell {
            flex: 1 1 0;
            min-width: 2px;
            height: 100%;
            border-radius: 2px;
            transition: transform 0.12s ease, filter 0.12s ease;
        }
        .timeline-cell:hover {
            transform: scaleY(1.06);
            filter: brightness(0.96);
            z-index: 1;
        }
        .timeline-cell--green { background: #2f9e76; }
        .timeline-cell--yellow { background: #d4a017; }
        .timeline-cell--red { background: #dc6b5a; }
        .timeline-cell--gray { background: #e8ecf1; }
        .monitor-models {
            margin-top: 0.15rem;
            padding-left: 1.1rem;
        }
        .monitor-loading,
        .monitor-empty {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }
        .monitor-tooltip {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            background: #fff;
            color: var(--text-primary);
            min-width: 168px;
            max-width: 240px;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid rgba(23, 32, 51, 0.07);
            box-shadow: 0 10px 28px rgba(23, 32, 51, 0.12), 0 2px 8px rgba(23, 32, 51, 0.05);
            display: none;
        }
        .monitor-tooltip-date {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            margin-bottom: 0.4rem;
            line-height: 1.35;
        }
        .monitor-tooltip-status {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.86rem;
            color: var(--text-secondary);
            line-height: 1.35;
        }
        .monitor-tooltip-icon {
            width: 17px;
            height: 17px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            line-height: 1;
        }
        .monitor-tooltip-icon--green { background: #2f9e76; }
        .monitor-tooltip-icon--yellow { background: #d4a017; }
        .monitor-tooltip-icon--red { background: #dc6b5a; }
        .monitor-tooltip-icon--gray { background: #b8bec8; }
        .monitor-tooltip-detail {
            margin-top: 0.35rem;
            font-size: 0.76rem;
            color: var(--text-tertiary);
            line-height: 1.35;
        }
        @media (max-width: 640px) {
            .monitor-row-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.35rem;
            }
            .monitor-rate {
                padding-left: 1.25rem;
            }
        }
        .monitor-page .header {
            padding: 1.15rem 1.35rem;
            margin-bottom: 1rem;
        }
        .monitor-page .header h1 {
            font-size: 1.55rem;
        }
        .monitor-page .header .subtitle {
            font-size: 0.86rem;
        }
        .monitor-page .surface-panel--padded {
            padding: 1.15rem 1.35rem 1.35rem;
        }
    </style>
</head>
<body class="monitor-page">
    <div class="container">
        <div id="pageNavMount"></div>

        <div class="header">
            <div class="header-top">
                <h1 id="pageTitle"></h1>
            </div>
        </div>

        <div class="surface-panel surface-panel--padded">
            <div class="monitor-toolbar">
                <div class="monitor-control">
                    <span class="monitor-control-label" id="modelLabel"></span>
                    <div class="monitor-dropdown" id="modelDropdown">
                        <button type="button" class="monitor-dropdown-trigger" id="modelFilterTrigger" aria-haspopup="listbox" aria-expanded="false">
                            <span class="monitor-dropdown-value" id="modelFilterLabel"></span>
                            <span class="monitor-dropdown-chevron"></span>
                        </button>
                        <div class="monitor-dropdown-menu" id="modelFilterMenu" role="listbox"></div>
                    </div>
                </div>
                <label class="monitor-toggle" id="sortToggle">
                    <input type="checkbox" id="sortByAvailability">
                    <span id="sortLabel"></span>
                </label>
            </div>
            <div id="boardRoot" class="monitor-loading">加载中...</div>
        </div>
    </div>

    <div id="monitorTooltip" class="monitor-tooltip"></div>

    <script>
    (function() {
        'use strict';

        var API_BASE = (window.MONITOR_CONFIG && window.MONITOR_CONFIG.apiBase) || '';
        var CONFIG = {};
        var boardData = null;
        var expandedPlatforms = {};
        var selectedModelValue = '';
        var tooltipEl = document.getElementById('monitorTooltip');

        function pickVisibleCount() {
            var targets = CONFIG.responsiveCells || [168, 144, 120, 96, 72, 48, 24];
            var breakpoints = [1400, 1280, 1200, 960, 768, 540];
            var width = window.innerWidth || 1400;
            for (var i = 0; i < breakpoints.length && i < targets.length - 1; i++) {
                if (width >= breakpoints[i]) return targets[i];
            }
            return targets[targets.length - 1];
        }

        function visibleHours(hours) {
            var count = pickVisibleCount();
            if (!hours || hours.length <= count) return hours || [];
            return hours.slice(hours.length - count);
        }

        function displayModelName(name) {
            if (!boardData || !boardData.model_display_names) return name;
            return boardData.model_display_names[name] || name;
        }

        function formatRate(rate) {
            return ((rate || 0) * 100).toFixed(1) + '%';
        }

        function formatTps(value) {
            if (value === null || value === undefined) return '—';
            return String(value);
        }

        function formatTooltipDate(hourMs) {
            var d = new Date(hourMs);
            var datePart = d.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'short'
            });
            return datePart + ' ' + String(d.getHours()).padStart(2, '0') + ':00';
        }

        function cellStatusInfo(cell) {
            var color = cell.color || 'gray';
            if (color === 'gray') {
                return { color: 'gray', text: '无数据', icon: '—' };
            }
            if (color === 'green') {
                return { color: 'green', text: '运行正常', icon: '✓' };
            }
            if (color === 'yellow') {
                return { color: 'yellow', text: '部分不可用', icon: '!' };
            }
            return { color: 'red', text: '出现故障', icon: '✕' };
        }

        function buildTooltipDetail(cell) {
            var parts = [];
            if (cell.success_rate !== null && cell.success_rate !== undefined) {
                parts.push('成功率 ' + (cell.success_rate * 100).toFixed(1) + '%');
            }
            if (cell.avg_tps !== null && cell.avg_tps !== undefined) {
                parts.push(cell.avg_tps + ' ' + (CONFIG.toolbar.tpsUnit || 'tok/s'));
            }
            return parts.join(' · ');
        }

        function showTooltip(hourMs, cell, targetEl) {
            var status = cellStatusInfo(cell);
            var detail = buildTooltipDetail(cell);

            tooltipEl.innerHTML =
                '<div class="monitor-tooltip-date">' + formatTooltipDate(hourMs) + '</div>' +
                '<div class="monitor-tooltip-status">' +
                    '<span class="monitor-tooltip-icon monitor-tooltip-icon--' + status.color + '">' + status.icon + '</span>' +
                    '<span>' + status.text + '</span>' +
                '</div>' +
                (detail ? '<div class="monitor-tooltip-detail">' + detail + '</div>' : '');

            tooltipEl.style.display = 'block';

            var rect = targetEl.getBoundingClientRect();
            var tipWidth = tooltipEl.offsetWidth;
            var tipHeight = tooltipEl.offsetHeight;
            var left = rect.left + rect.width / 2 - tipWidth / 2;
            var top = rect.top - tipHeight - 10;

            left = Math.max(8, Math.min(left, window.innerWidth - tipWidth - 8));
            top = Math.max(8, top);

            tooltipEl.style.left = left + 'px';
            tooltipEl.style.top = top + 'px';
        }

        function hideTooltip() {
            tooltipEl.style.display = 'none';
            tooltipEl.innerHTML = '';
        }

        function syncSortToggle() {
            var toggle = document.getElementById('sortToggle');
            var checked = document.getElementById('sortByAvailability').checked;
            if (toggle) {
                toggle.classList.toggle('is-active', checked);
            }
        }

        function renderTimelineBar(hours) {
            var bar = document.createElement('div');
            bar.className = 'monitor-bar';
            visibleHours(hours).forEach(function(cell) {
                var el = document.createElement('div');
                el.className = 'timeline-cell timeline-cell--' + (cell.color || 'gray');
                el.addEventListener('mouseenter', function() {
                    showTooltip(cell.hour_ms, cell, el);
                });
                el.addEventListener('mouseleave', hideTooltip);
                bar.appendChild(el);
            });
            return bar;
        }

        function formatRateDisplay(rate) {
            return formatRate(rate) + ' ' + (CONFIG.toolbar.availableLabel || '可用');
        }

        function statusDotColor(hours) {
            var cells = visibleHours(hours);
            if (!cells.length) return 'gray';
            return cells[cells.length - 1].color || 'gray';
        }

        function renderStatusRow(options) {
            options = options || {};
            var row = document.createElement('div');
            row.className = 'monitor-row' + (options.nested ? ' monitor-row--nested' : '');

            var top = document.createElement('div');
            top.className = 'monitor-row-top' + (options.clickable ? ' monitor-row-top--clickable' : '');
            if (options.onClick) {
                top.addEventListener('click', options.onClick);
            }

            var title = document.createElement('div');
            title.className = 'monitor-row-title';

            var dot = document.createElement('span');
            dot.className = 'status-dot status-dot--' + statusDotColor(options.hours);
            title.appendChild(dot);

            if (options.compactPlatformName) {
                var platformName = document.createElement('span');
                platformName.className = 'monitor-name';
                platformName.textContent = options.compactPlatformName;
                var modelPart = document.createElement('span');
                modelPart.className = 'monitor-name-sub';
                modelPart.textContent = ' · ' + options.title;
                title.appendChild(platformName);
                title.appendChild(modelPart);
            } else {
                var nameEl = document.createElement('span');
                nameEl.className = 'monitor-name';
                nameEl.textContent = options.title;
                title.appendChild(nameEl);
            }

            if (options.meta) {
                var meta = document.createElement('span');
                meta.className = 'monitor-meta';
                meta.textContent = options.meta;
                title.appendChild(meta);
            }

            if (options.expanded !== undefined) {
                var chevron = document.createElement('span');
                chevron.className = 'monitor-chevron' + (options.expanded ? ' monitor-chevron--open' : '');
                title.appendChild(chevron);
            }

            var rate = document.createElement('span');
            rate.className = 'monitor-rate';
            rate.textContent = formatRateDisplay(options.rate);

            top.appendChild(title);
            top.appendChild(rate);
            row.appendChild(top);
            row.appendChild(renderTimelineBar(options.hours));
            return row;
        }

        function renderModelBlock(model, opts) {
            opts = opts || {};
            return renderStatusRow({
                nested: true,
                compactPlatformName: opts.compactPlatformName || null,
                title: displayModelName(model.model_slug),
                meta: formatTps(model.avg_tps) + ' ' + (CONFIG.toolbar.tpsUnit || 'tok/s'),
                rate: model.availability_rate,
                hours: model.hours
            });
        }

        function renderPlatformBlock(platform) {
            var block = document.createElement('div');
            block.className = 'monitor-platform';

            block.appendChild(renderStatusRow({
                title: platform.platform_display_name || platform.platform_slug,
                meta: (platform.models ? platform.models.length : 0) + ' ' + (CONFIG.toolbar.modelsLabel || '个模型'),
                rate: platform.availability_rate,
                hours: platform.hours,
                clickable: true,
                expanded: !!expandedPlatforms[platform.platform_slug],
                onClick: function() {
                    expandedPlatforms[platform.platform_slug] = !expandedPlatforms[platform.platform_slug];
                    renderBoard();
                }
            }));

            if (expandedPlatforms[platform.platform_slug] && platform.models && platform.models.length) {
                var modelsWrap = document.createElement('div');
                modelsWrap.className = 'monitor-models';
                platform.models.forEach(function(model) {
                    modelsWrap.appendChild(renderModelBlock(model));
                });
                block.appendChild(modelsWrap);
            }

            return block;
        }

        function renderSectionHead(label, count) {
            var head = document.createElement('div');
            head.className = 'monitor-section-head';
            var title = document.createElement('span');
            title.className = 'monitor-section-title';
            title.textContent = label;
            var meta = document.createElement('span');
            meta.className = 'monitor-section-count';
            meta.textContent = count;
            head.appendChild(title);
            head.appendChild(meta);
            return head;
        }

        function collectModelOptions(platforms) {
            var set = {};
            (platforms || []).forEach(function(platform) {
                (platform.models || []).forEach(function(model) {
                    set[model.model_slug] = true;
                });
            });
            return Object.keys(set).sort();
        }

        function sortedPlatforms(platforms, sortByAvailability) {
            var copy = (platforms || []).slice();
            if (!sortByAvailability) return copy;
            copy.sort(function(a, b) {
                return (b.availability_rate || 0) - (a.availability_rate || 0);
            });
            return copy;
        }

        function renderBoard() {
            var root = document.getElementById('boardRoot');
            root.innerHTML = '';
            root.className = 'monitor-list';

            if (!boardData || !boardData.platforms || !boardData.platforms.length) {
                root.className = 'monitor-empty';
                root.textContent = CONFIG.emptyLabel || '暂无数据';
                return;
            }

            var selectedModel = selectedModelValue;
            var sortByAvailability = document.getElementById('sortByAvailability').checked;

            if (selectedModel) {
                var rows = [];
                sortedPlatforms(boardData.platforms, sortByAvailability).forEach(function(platform) {
                    (platform.models || []).forEach(function(model) {
                        if (model.model_slug !== selectedModel) return;
                        rows.push({
                            platform: platform,
                            model: model
                        });
                    });
                });
                if (!rows.length) {
                    root.className = 'monitor-empty';
                    root.textContent = CONFIG.emptyLabel || '暂无数据';
                    return;
                }
                if (sortByAvailability) {
                    rows.sort(function(a, b) {
                        return (b.model.availability_rate || 0) - (a.model.availability_rate || 0);
                    });
                }
                root.appendChild(renderSectionHead(
                    displayModelName(selectedModel),
                    rows.length + ' 个平台'
                ));
                rows.forEach(function(row) {
                    root.appendChild(renderModelBlock(row.model, {
                        compactPlatformName: row.platform.platform_display_name || row.platform.platform_slug
                    }));
                });
                return;
            }

            var platforms = sortedPlatforms(boardData.platforms, sortByAvailability);
            root.appendChild(renderSectionHead('平台', platforms.length + ' 个'));
            platforms.forEach(function(platform) {
                root.appendChild(renderPlatformBlock(platform));
            });
        }

        function closeModelDropdown() {
            var dropdown = document.getElementById('modelDropdown');
            var trigger = document.getElementById('modelFilterTrigger');
            dropdown.classList.remove('is-open');
            trigger.setAttribute('aria-expanded', 'false');
        }

        function openModelDropdown() {
            var dropdown = document.getElementById('modelDropdown');
            var trigger = document.getElementById('modelFilterTrigger');
            dropdown.classList.add('is-open');
            trigger.setAttribute('aria-expanded', 'true');
        }

        function toggleModelDropdown() {
            var dropdown = document.getElementById('modelDropdown');
            if (dropdown.classList.contains('is-open')) {
                closeModelDropdown();
            } else {
                openModelDropdown();
            }
        }

        function updateModelFilterLabel() {
            var labelEl = document.getElementById('modelFilterLabel');
            if (!selectedModelValue) {
                labelEl.textContent = (CONFIG.toolbar && CONFIG.toolbar.allModels) || '全部';
                return;
            }
            labelEl.textContent = displayModelName(selectedModelValue);
        }

        function setModelFilter(value) {
            selectedModelValue = value || '';
            updateModelFilterLabel();

            var menu = document.getElementById('modelFilterMenu');
            Array.prototype.forEach.call(menu.querySelectorAll('.monitor-dropdown-option'), function(btn) {
                btn.classList.toggle('is-selected', btn.getAttribute('data-value') === selectedModelValue);
            });

            closeModelDropdown();
            renderBoard();
        }

        function populateModelFilter(platforms) {
            var menu = document.getElementById('modelFilterMenu');
            var current = selectedModelValue || '';
            menu.innerHTML = '';

            function addOption(value, label) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'monitor-dropdown-option' + (value === current ? ' is-selected' : '');
                btn.setAttribute('data-value', value);
                btn.setAttribute('role', 'option');
                btn.textContent = label;
                btn.addEventListener('click', function() {
                    setModelFilter(value);
                });
                menu.appendChild(btn);
            }

            addOption('', (CONFIG.toolbar && CONFIG.toolbar.allModels) || '全部');
            collectModelOptions(platforms).forEach(function(name) {
                addOption(name, displayModelName(name));
            });

            if (current && collectModelOptions(platforms).indexOf(current) < 0) {
                selectedModelValue = '';
            }
            updateModelFilterLabel();
        }

        function initModelDropdown() {
            document.getElementById('modelFilterTrigger').addEventListener('click', function(e) {
                e.stopPropagation();
                toggleModelDropdown();
            });

            document.addEventListener('click', function() {
                closeModelDropdown();
            });

            document.getElementById('modelDropdown').addEventListener('click', function(e) {
                e.stopPropagation();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModelDropdown();
                }
            });
        }

        function fetchBoard() {
            var root = document.getElementById('boardRoot');
            root.className = 'monitor-loading';
            root.textContent = CONFIG.loadingLabel || '加载中...';

            fetch(API_BASE + '/monitor/board?days=7')
                .then(function(r) { return r.json(); })
                .then(function(resp) {
                    boardData = (resp && resp.data) || resp;
                    populateModelFilter(boardData.platforms || []);
                    renderBoard();
                })
                .catch(function() {
                    root.className = 'monitor-empty';
                    root.textContent = CONFIG.errorLabel || '数据加载失败，请稍后重试';
                });
        }

        function loadPageConfig() {
            return fetch('monitor-config.json')
                .then(function(r) { return r.json(); })
                .then(function(cfg) { CONFIG = cfg; })
                .catch(function() { CONFIG = {}; });
        }

        function applyStaticTexts() {
            document.getElementById('pageTitle').textContent = CONFIG.pageTitle || '平台可用性监控';
            document.getElementById('modelLabel').textContent = (CONFIG.toolbar && CONFIG.toolbar.modelLabel) || '模型';
            document.getElementById('sortLabel').textContent = (CONFIG.toolbar && CONFIG.toolbar.sortByAvailability) || '按可用率排序';
            syncSortToggle();
        }

        document.getElementById('sortByAvailability').addEventListener('change', function() {
            syncSortToggle();
            renderBoard();
        });
        window.addEventListener('resize', renderBoard);
        initModelDropdown();

        document.addEventListener('DOMContentLoaded', function() {
            renderPageNav('pageNavMount', {
                activeKey: 'monitor',
                tabs: [
                    { key: 'index', href: '../index.html', id: 'navIndexTab' },
                    { key: 'plan-usage', href: '../plan-usage.html', id: 'navPlanUsageTab' },
                    { key: 'coding-agents', href: '../coding-agents.html', id: 'navCodingAgentsTab' },
                    { key: 'relays', href: '../relays.html', id: 'navRelaysTab' },
                    { key: 'relay-detect', href: '../relay-detect.html', id: 'navDetectTab' },
                    { key: 'monitor', href: 'index.html', text: '可用性监控' }
                ],
                settings: {
                    panelTitle: '显示设置',
                    ultraWideLabel: '超宽屏模式'
                }
            });

            loadPageConfig().then(function() {
                applyStaticTexts();
                fetchBoard();
            });
        });
    })();
    </script>
</body>
</html>

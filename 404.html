<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在 - Coding Plan</title>
  <link rel="canonical" href="https://codingplan.fyi/404.html">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles/shared.css">
  <link rel="stylesheet" href="/styles/design-system.css">
  <style>
    main { max-width: 42rem; margin: 15vh auto; padding: 24px; }
    h1 { margin: 16px 0; }
    nav { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 24px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; }
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="Coding Plan 首页">Coding Plan</a>
    <p>404</p>
    <h1>页面不存在</h1>
    <p>请检查网址，或从首页继续浏览。</p>
    <p id="return-status" aria-live="polite" hidden><span id="return-countdown">3</span> 秒内无操作将自动返回首页。</p>
    <nav aria-label="继续浏览">
      <a href="/">返回首页</a>
      <a href="/articles/">浏览文章</a>
    </nav>
  </main>
  <script>
    const status = document.getElementById('return-status');
    const countdown = document.getElementById('return-countdown');
    const activityEvents = ['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'];
    let remaining = 3;
    status.hidden = false;
    const timer = window.setInterval(() => {
      countdown.textContent = String(--remaining);
      if (remaining === 0) {
        window.clearInterval(timer);
        window.location.replace('/');
      }
    }, 1000);
    function cancelReturn() {
      window.clearInterval(timer);
      status.textContent = '已取消自动返回，可选择下方入口继续浏览。';
      activityEvents.forEach(event => window.removeEventListener(event, cancelReturn));
    }
    activityEvents.forEach(event => window.addEventListener(event, cancelReturn, { passive: true }));
  </script>
</body>
</html>

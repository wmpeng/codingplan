<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Coding Plan 套餐价格与额度对比 - Coding Plan</title>
  <meta name="description" content="完整对比 AI Coding Plan 套餐的月费、首月、季付、年付、请求额度、支持模型和购买状态。">
  <link rel="canonical" href="https://vibecoding.dreamfree.space/plans/">
  <link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/styles/shared.css"><link rel="stylesheet" href="/styles/tool-page.css">
</head>
<body class="tool-page">
  <main class="tool-page-main">
    <div class="tool-topbar"><a class="tool-brand" href="/">Coding Plan</a><nav class="tool-nav" aria-label="主导航"><a href="/platforms/">平台</a><a href="/pricing/">价格</a><a href="/plans/" aria-current="page">套餐</a><a href="/monitor/">可用性</a></nav></div>
    <div class="tool-breadcrumb"><a href="/">首页</a><span>/</span><span aria-current="page">套餐对比</span></div>
    <header class="tool-hero"><div><p class="tool-eyebrow">PLAN CATALOG</p><h1>套餐价格与额度对比</h1><p>按平台、模型、月预算和套餐权益筛选完整套餐目录，含已下架记录，点击表头可排序。</p></div><a class="tool-button" href="/pricing/">查看价格与用量图 →</a></header>
    <section id="plansPage">
      <div class="tool-panel plan-filter-panel">
        <p class="filter-help">预算和价格范围统一按折合人民币比较（美元按当前站点汇率换算）；表格保留原始币种并同时显示各周期价格。</p>
        <div class="plan-filter-columns"><details open><summary>平台</summary><div class="plan-checks" data-plan-platforms></div></details><details><summary>模型</summary><div class="plan-checks plan-checks-tall" data-plan-models></div></details><details><summary>套餐标签</summary><div class="plan-checks" data-plan-tags></div></details></div>
        <div class="plan-filter-row"><label>模型匹配 <select data-plan-model-match><option value="any">任意一个</option><option value="all">全部所选</option></select></label><label>平台状态 <select data-plan-status><option value="open">开放购买</option><option value="limited">含定时放量</option><option value="paused">含暂停售</option><option value="delisted">全部状态</option></select></label><label><input type="checkbox" data-plan-discontinued> 包含下架套餐</label><label>月预算（¥） <input type="number" data-budget-min placeholder="最低"><span>—</span><input type="number" data-budget-max placeholder="最高"></label><button type="button" class="tool-button" data-plan-reset>恢复全量</button></div>
        <div class="plan-range-grid"><div><strong>价格范围（折合人民币）</strong><div class="plan-range-row">首月 <input type="number" data-range="firstMonthPrice" data-part="min" placeholder="最低"><span>—</span><input type="number" data-range="firstMonthPrice" data-part="max" placeholder="最高"></div><div class="plan-range-row">包月 <input type="number" data-range="monthlyPrice" data-part="min" placeholder="最低"><span>—</span><input type="number" data-range="monthlyPrice" data-part="max" placeholder="最高"></div><div class="plan-range-row">包季 <input type="number" data-range="quarterlyPrice" data-part="min" placeholder="最低"><span>—</span><input type="number" data-range="quarterlyPrice" data-part="max" placeholder="最高"></div><div class="plan-range-row">包年 <input type="number" data-range="yearlyPrice" data-part="min" placeholder="最低"><span>—</span><input type="number" data-range="yearlyPrice" data-part="max" placeholder="最高"></div></div><div><strong>请求数范围</strong><div class="plan-range-row">5 小时 <input type="number" data-request-range="fiveHoursRequests" data-part="min" placeholder="最低"><span>—</span><input type="number" data-request-range="fiveHoursRequests" data-part="max" placeholder="最高"></div><div class="plan-range-row">每周 <input type="number" data-request-range="weeklyRequests" data-part="min" placeholder="最低"><span>—</span><input type="number" data-request-range="weeklyRequests" data-part="max" placeholder="最高"></div><div class="plan-range-row">每月 <input type="number" data-request-range="monthlyRequests" data-part="min" placeholder="最低"><span>—</span><input type="number" data-request-range="monthlyRequests" data-part="max" placeholder="最高"></div></div></div>
      </div>
      <p class="tool-count plan-count" data-plan-count>加载中…</p><p class="tool-empty" data-plan-error hidden></p>
      <div class="tool-panel tool-table-wrap"><table class="tool-table"><thead><tr><th>平台</th><th>套餐</th><th><button type="button" class="table-sort-button" data-plan-sort="monthlyPrice">价格 ↕</button></th><th>请求数（5h / 周 / 月）</th><th>支持模型</th><th>标签</th><th>操作</th></tr></thead><tbody data-plan-body></tbody></table></div>
    </section>
    <footer class="tool-footer"><span>价格和额度可能变化；未知值表示官方或公开资料未给出。</span><a href="/">返回首页</a></footer>
  </main>
  <script src="/scripts/entity-data.js"></script><script src="/scripts/filter-state.js"></script><script src="/scripts/plans-page.js"></script>
</body>
</html>

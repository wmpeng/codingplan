<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle"></title>
    <link rel="icon" href="/favicon.ico?v=260418" type="image/x-icon">
    <link rel="stylesheet" href="styles/shared.css?v=260515">
    <link rel="stylesheet" href="styles/dark-mode.css?v=260701">
    <script src="scripts/plan-usage-config.local.js"></script>
    <script src="scripts/plan-usage-config.js"></script>
    <script src="scripts/shared.js?v=260512"></script>
    <style>
        .header .subtitle {
            margin-bottom: 10px;
        }

        .intro-card {
            margin-bottom: 28px;
        }

        .intro-card p {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .intro-card p:last-child {
            margin-bottom: 0;
        }

        .section-description {
            margin: -8px 0 22px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .selection-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .selection-row.selection-row-triple {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .metric-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .metric-row.metric-row-dual {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .is-hidden-field {
            display: none !important;
        }

        .metric-row.metric-row-single {
            grid-template-columns: minmax(0, 1fr);
        }

        .metric-row.metric-row-quad {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group.full-width {
            grid-column: 1 / -1;
        }

        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .field-label-row {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .field-help-trigger-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }

        .field-help-trigger {
            appearance: none;
            width: 18px;
            height: 18px;
            padding: 0;
            border: 1px solid rgba(99, 102, 241, 0.32);
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.08);
            color: var(--accent-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            cursor: help;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
        }

        .field-help-trigger:hover,
        .field-help-trigger-wrap.is-open .field-help-trigger,
        .field-help-trigger:focus-visible {
            background: rgba(99, 102, 241, 0.14);
            border-color: rgba(99, 102, 241, 0.5);
            color: var(--accent-secondary);
            transform: translateY(-1px);
        }

        .field-help-trigger:focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.25);
            outline-offset: 2px;
        }

        .field-help-popover {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            width: min(340px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            box-shadow: var(--shadow-md);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease;
        }

        .field-help-popover::before {
            content: '';
            position: absolute;
            top: -7px;
            left: 50%;
            width: 12px;
            height: 12px;
            background: inherit;
            border-left: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
            transform: translateX(-50%) rotate(45deg);
        }

        .field-help-trigger-wrap:hover .field-help-popover,
        .field-help-trigger-wrap:focus-within .field-help-popover,
        .field-help-trigger-wrap.is-open .field-help-popover {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .field-help-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field-help-text {
            font-size: 12px;
            line-height: 1.65;
            color: var(--text-secondary);
            white-space: pre-line;
        }

        .field-help-image-wrap {
            display: none;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(148, 163, 184, 0.08);
        }

        .field-help-image-wrap.has-image {
            display: block;
            cursor: zoom-in;
        }

        .field-help-image-wrap.has-image:focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.55);
            outline-offset: 2px;
        }

        .field-help-image {
            display: block;
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            pointer-events: none;
        }

        .field-help-lightbox {
            position: fixed;
            inset: 0;
            z-index: 10050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            box-sizing: border-box;
        }

        .field-help-lightbox[hidden] {
            display: none !important;
        }

        .field-help-lightbox-backdrop {
            position: absolute;
            inset: 0;
            border: 0;
            padding: 0;
            margin: 0;
            background: rgba(15, 23, 42, 0.78);
            cursor: pointer;
        }

        .field-help-lightbox-inner {
            position: relative;
            z-index: 1;
            max-width: min(96vw, 1120px);
            max-height: min(88vh, 900px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .field-help-lightbox-img {
            display: block;
            max-width: 100%;
            max-height: min(88vh, 900px);
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
        }

        .field-help-lightbox-close {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 999px;
            padding: 0;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: #fff;
            background: rgba(30, 41, 59, 0.92);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(40%, -40%);
        }

        .field-help-lightbox-close:hover {
            background: rgba(51, 65, 85, 0.96);
        }

        .field-help {
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        .form-input,
        .form-textarea,
        .form-select-trigger {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            font-family: inherit;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select-trigger:focus,
        .multi-select.open .form-select-trigger {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-textarea {
            min-height: 92px;
            resize: vertical;
            line-height: 1.6;
        }

        .multi-select {
            position: relative;
        }

        .form-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
            cursor: pointer;
        }

        .form-select-trigger:disabled {
            cursor: not-allowed;
            color: var(--text-tertiary);
            background: var(--bg-secondary);
            opacity: 0.85;
        }

        .form-select-trigger::after {
            content: '▾';
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .multi-select.open .form-select-trigger::after {
            content: '▴';
        }

        .multi-select-label {
            min-height: 22px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .multi-select-label.placeholder {
            color: var(--text-tertiary);
        }

        .multi-select-panel {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            z-index: 20;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            box-shadow: var(--shadow-md);
            display: none;
        }

        .multi-select.open .multi-select-panel {
            display: block;
        }

        .multi-select-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .multi-select-action {
            border: none;
            background: transparent;
            color: var(--accent-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .multi-select-options {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .multi-select-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-primary);
        }

        .multi-select-option:hover {
            background: var(--bg-secondary);
        }

        .single-select-option {
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            font: inherit;
        }

        .single-select-option:disabled {
            color: var(--text-tertiary);
            cursor: not-allowed;
        }

        .single-select-option:disabled:hover {
            background: transparent;
        }

        .single-select-option.selected {
            background: rgba(99, 102, 241, 0.08);
            color: var(--accent-primary);
        }

        .multi-select-empty {
            color: var(--text-tertiary);
            font-size: 13px;
            padding: 10px;
        }

        .submit-row {
            margin-top: 26px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 30px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-note {
            color: var(--text-tertiary);
            font-size: 13px;
            line-height: 1.6;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .result-card {
            margin-top: 24px;
            padding: 18px 20px;
            display: none;
            transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        .submit-card {
            position: relative;
            z-index: 10;
            overflow: visible;
        }

        .records-card {
            margin-top: 28px;
            padding: 28px 30px;
        }

        .records-toolbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: nowrap;
        }

        .records-filters {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(108px, 150px));
            gap: 10px 12px;
            min-width: 0;
        }

        .records-filters .multi-select-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            padding: 11px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .secondary-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .secondary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .records-toolbar-right {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            flex: 0 0 auto;
            flex-wrap: nowrap;
            justify-content: flex-end;
        }

        .token-unit-field {
            min-width: 0;
        }

        .token-unit-field .segmented-control {
            margin-top: 8px;
        }

        .segmented-control {
            display: inline-flex;
            padding: 3px;
            gap: 2px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--bg-primary);
        }

        .segment-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 999px;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            color: var(--text-secondary);
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .segment-btn:hover:not(:disabled) {
            color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .segment-btn + .segment-btn {
            border-left: none;
        }

        .segment-btn.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 4px 14px rgba(15, 118, 110, 0.28);
        }

        .segment-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .records-meta {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .records-meta-primary {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .records-meta-secondary {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .table-wrapper {
            margin-top: 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-primary);
        }

        .table-scroll {
            overflow-x: auto;
            max-width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .records-table {
            width: 100%;
            min-width: 940px;
            border-collapse: collapse;
        }

        .records-table thead {
            background: linear-gradient(180deg, rgba(248, 250, 252, 0.95), rgba(241, 245, 249, 0.95));
        }

        .records-table th,
        .records-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }

        .records-table tbody tr:last-child td {
            border-bottom: none;
        }

        .records-table th {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .records-table td {
            font-size: 14px;
            color: var(--text-primary);
        }

        .records-table th.sortable {
            cursor: pointer;
            user-select: none;
        }

        .records-table th.sortable::after {
            content: '↕';
            margin-left: 6px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .records-table th.sort-asc,
        .records-table th.sort-desc {
            color: var(--accent-primary);
        }

        .records-table th.sort-asc::after {
            content: '↑';
            color: var(--accent-primary);
        }

        .records-table th.sort-desc::after {
            content: '↓';
            color: var(--accent-primary);
        }

        .cell-primary {
            font-weight: 600;
            color: var(--text-primary);
        }

        .cell-subtext {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-tertiary);
            white-space: normal;
            line-height: 1.5;
        }

        .estimates-block {
            margin-top: 22px;
            margin-bottom: 40px;
        }

        .recent-submissions-block {
            margin-top: 8px;
            padding-top: 4px;
        }

        .recent-submissions-block > .section-title--subsection {
            margin-bottom: 14px;
        }

        .recent-submissions-block .records-meta {
            margin-top: 0;
        }

        .section-title--subsection {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .estimates-hint {
            font-size: 12px;
            color: var(--text-tertiary);
            margin: 0 0 14px;
            line-height: 1.55;
        }

        .estimates-table {
            min-width: 860px;
        }

        .estimate-pin-col,
        .estimate-pin-cell {
            width: 56px;
            text-align: center !important;
            vertical-align: middle !important;
        }

        .estimate-pin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.2s;
        }

        .estimate-pin-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-1px);
        }

        .estimate-pin-btn:focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.22);
            outline-offset: 2px;
        }

        .estimate-pin-btn.is-pinned {
            border-color: rgba(99, 102, 241, 0.28);
            background: rgba(99, 102, 241, 0.10);
            color: var(--accent-primary);
        }

        .estimate-pin-icon {
            display: block;
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .pinned-row td {
            background: rgba(99, 102, 241, 0.035);
        }

        .estimate-metric-cell {
            vertical-align: middle;
        }

        .estimate-median {
            font-weight: 700;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }

        .estimate-ci {
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .numeric-cell {
            font-variant-numeric: tabular-nums;
        }

        .status-row td {
            padding: 32px 16px;
            text-align: center;
        }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .status-text.error {
            color: var(--accent-error);
        }

        .pagination-row {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        .pagination-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pagination-btn {
            padding: 10px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .pagination-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .pagination-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .result-card.success {
            border-color: rgba(16, 185, 129, 0.28);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.06), rgba(16, 185, 129, 0.02));
        }

        .result-card.error {
            border-color: rgba(239, 68, 68, 0.28);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.06), rgba(239, 68, 68, 0.02));
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-card.success .result-title {
            color: var(--accent-success);
        }

        .result-card.error .result-title {
            color: var(--accent-error);
        }

        .result-body {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 14px;
        }

        .meta-list {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .meta-pill {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 10px;
        }

        .result-card.flash-success {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12), var(--shadow-lg);
            transform: translateY(-2px);
        }

        .toast-stack {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 2200;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            min-width: 300px;
            max-width: min(420px, calc(100vw - 32px));

            transform: translateY(-12px) scale(0.98);

            opacity: 1;

        function closeFieldHelpImageLightbox() {
            var lb = fieldHelpLightboxEl || document.getElementById('fieldHelpImageLightbox');
            if (!lb || lb.hidden) {
                return;
            }
            lb.hidden = true;
            if (fieldHelpLightboxImg) {
                fieldHelpLightboxImg.removeAttribute('src');
                fieldHelpLightboxImg.alt = '';
            }
            document.body.style.overflow = prevBodyOverflowForLightbox;
            if (fieldHelpLightboxKeydownBound) {
                fieldHelpLightboxKeydownBound = false;
                document.removeEventListener('keydown', onFieldHelpLightboxKeydown);
            }
        }

        function clampFieldHelpPopover(entry) {
            if (!entry || !entry.popover) {
                return;
            }
            if (window.innerWidth <= 768) {
                entry.popover.style.transform = '';
                return;
            }
            var pop = entry.popover;
            var m = 16;
            var vw = window.innerWidth;
            var s = 0;
            var iter;
            for (iter = 0; iter < 8; iter++) {
                pop.style.transform = 'translateX(calc(-50% + ' + s + 'px)) translateY(0)';
                var r = pop.getBoundingClientRect();
                var ds = 0;
                if (r.left < m) {
                    ds += m - r.left;
                }
                if (r.right > vw - m) {
                    ds -= r.right - (vw - m);
                }
                if (Math.abs(ds) < 0.5) {
                    break;
                }
                s += ds;
            }
        }

        function scheduleClampFieldHelpPopover(entry) {
            requestAnimationFrame(function() {
                clampFieldHelpPopover(entry);
            });
        }

        function initFieldHelp() {
            if (!fieldHelpEntries.length) {
                fieldHelpEntries = Array.prototype.slice.call(document.querySelectorAll('[data-field-help]')).map(function(wrap) {
                    return {
                        wrap: wrap,
                        fieldKey: wrap.getAttribute('data-field-help') || '',
                        trigger: wrap.querySelector('.field-help-trigger'),
                        popover: wrap.querySelector('.field-help-popover'),
                        text: wrap.querySelector('.field-help-text'),
                        imageWrap: wrap.querySelector('.field-help-image-wrap'),
                        image: wrap.querySelector('.field-help-image')
                    };
                }).filter(function(entry) {
                    return entry.fieldKey && entry.trigger && entry.popover && entry.text && entry.imageWrap && entry.image;
                });

                fieldHelpEntries.forEach(function(entry) {
                    entry.image.addEventListener('load', function() {
                        if (entry.image.getAttribute('src')) {
                            entry.imageWrap.classList.add('has-image');
                            scheduleClampFieldHelpPopover(entry);
                        }
                    });
                    entry.image.addEventListener('error', function() {
                        entry.imageWrap.classList.remove('has-image');
                    });
                    entry.trigger.addEventListener('click', function(event) {
                        event.preventDefault();
                        event.stopPropagation();
                        if (openFieldHelpWrap === entry.wrap) {
                            closeFieldHelp(entry.wrap);
                            return;
                        }
                        openFieldHelp(entry.wrap);
                    });
                    entry.imageWrap.addEventListener('click', function() {
                        if (!entry.imageWrap.classList.contains('has-image')) {
                            return;
                        }
                        var src = entry.image.getAttribute('src');
                        if (!src) {
                            return;
                        }
                        openFieldHelpImageLightbox(src, entry.image.getAttribute('alt') || '');
                    });
                    entry.imageWrap.addEventListener('keydown', function(event) {
                        if (!entry.imageWrap.classList.contains('has-image')) {
                            return;
                        }
                        if (event.key !== 'Enter' && event.key !== ' ') {
                            return;
                        }
                        event.preventDefault();
                        var src = entry.image.getAttribute('src');
                        if (!src) {
                            return;
                        }
                        openFieldHelpImageLightbox(src, entry.image.getAttribute('alt') || '');
                    });
                    entry.wrap.addEventListener('mouseenter', function() {
                        scheduleClampFieldHelpPopover(entry);
                    });
                    entry.wrap.addEventListener('focusin', function() {
                        scheduleClampFieldHelpPopover(entry);
                    });
                    entry.wrap.addEventListener('mouseleave', function() {
                        if (!entry.wrap.classList.contains('is-open')) {
                            entry.popover.style.transform = '';
                        }
                    });
                });

                if (!fieldHelpResizeWired) {
                    fieldHelpResizeWired = true;
                    var resizeClampTimer = null;
                    window.addEventListener('resize', function() {
                        if (resizeClampTimer) {
                            clearTimeout(resizeClampTimer);
                        }
                        resizeClampTimer = setTimeout(function() {
                            fieldHelpEntries.forEach(function(e) {
                                if (e.wrap.classList.contains('is-open') || e.wrap.matches(':hover')) {
                                    clampFieldHelpPopover(e);
                                }
                            });
                        }, 80);
                    });
                }
            }

            renderFieldHelp();
        }

        function renderFieldHelp() {
            var helpConfig = pageContent && pageContent.form && pageContent.form.fieldHelp ? pageContent.form.fieldHelp : {};

            fieldHelpEntries.forEach(function(entry) {
                var config = helpConfig[entry.fieldKey] || {};
                var helpText = typeof config.text === 'string' ? config.text : '';
                var imagePath = typeof config.image === 'string' ? config.image : '';
                var imageAlt = typeof config.imageAlt === 'string' ? config.imageAlt : '';
                var labelText = getFormText(entry.fieldKey + 'Label') || entry.fieldKey;
                var triggerText = typeof config.triggerAriaLabel === 'string' && config.triggerAriaLabel
                    ? config.triggerAriaLabel
                    : labelText + '说明';

                entry.text.textContent = helpText;
                entry.trigger.setAttribute('aria-label', triggerText);
                entry.popover.setAttribute('aria-label', triggerText);

                if (imagePath) {
                    entry.image.src = imagePath;
                    entry.image.alt = imageAlt || labelText + '说明图片';
                    entry.imageWrap.classList.remove('has-image');
                    entry.imageWrap.tabIndex = 0;
                    entry.imageWrap.setAttribute('role', 'button');
                    entry.imageWrap.setAttribute('aria-label', '点击查看大图');
                } else {
                    entry.image.removeAttribute('src');
                    entry.image.alt = '';
                    entry.imageWrap.classList.remove('has-image');
                    entry.imageWrap.removeAttribute('tabindex');
                    entry.imageWrap.removeAttribute('role');
                    entry.imageWrap.removeAttribute('aria-label');
                }

                var hidden = !helpText && !imagePath;
                entry.wrap.hidden = hidden;
                if (hidden && openFieldHelpWrap === entry.wrap) {
                    closeFieldHelp(entry.wrap);
                }
            });
        }

        function openFieldHelp(targetWrap) {
            fieldHelpEntries.forEach(function(entry) {
                var isTarget = entry.wrap === targetWrap;
                entry.wrap.classList.toggle('is-open', isTarget);
                entry.popover.setAttribute('aria-hidden', isTarget ? 'false' : 'true');
                entry.trigger.setAttribute('aria-expanded', isTarget ? 'true' : 'false');
            });
            openFieldHelpWrap = targetWrap || null;
            if (targetWrap) {
                fieldHelpEntries.forEach(function(entry) {
                    if (entry.wrap === targetWrap) {
                        scheduleClampFieldHelpPopover(entry);
                    }
                });
            }
        }

        function closeFieldHelp(targetWrap) {
            fieldHelpEntries.forEach(function(entry) {
                if (!targetWrap || entry.wrap === targetWrap) {
                    entry.wrap.classList.remove('is-open');
                    entry.popover.setAttribute('aria-hidden', 'true');
                    entry.trigger.setAttribute('aria-expanded', 'false');
                    entry.popover.style.transform = '';
                }
            });
            if (!targetWrap || openFieldHelpWrap === targetWrap) {
                openFieldHelpWrap = null;
            }
        }

        function fetchSubmissionList() {
            var params = new URLSearchParams();
            if (listState.vendorFilter) {
                params.set('vendor', listState.vendorFilter);
            }
            if (listState.planFilter) {
                params.set('plan', listState.planFilter);
            }
            params.set('page', String(listState.page));
            params.set('page_size', String(listState.pageSize));
            params.set('sort_by', listState.sortBy);
            params.set('sort_direction', listState.sortDirection);

            listState.loading = true;
            listState.error = '';
            renderSubmissionTableState();
            renderSubmissionMeta();

            fetch(API_BASE + '/plan_usage/submissions?' + params.toString())
                .then(function(resp) {
                    return resp.json().then(function(data) {
                        return { ok: resp.ok, data: data };
                    });
                })
                .then(function(result) {
                    if (!result.ok || result.data.err_code) {
                        throw new Error(resolveErrorMessage(result.data) || getListText('loadError'));
                    }

                    var payload = result.data.data || {};
                    listState.items = Array.isArray(payload.items) ? payload.items : [];
                    listState.total = Number(payload.total) || 0;
                    listState.page = Number(payload.page) || 0;
                    listState.pageSize = Number(payload.page_size) || listState.pageSize;
                    listState.hasNext = Boolean(payload.has_next);
                    listState.loading = false;
                    listState.error = '';
                    renderSubmissionTableState();
                    renderSubmissionMeta();
                    updateListSortHeaders();
                })
                .catch(function(err) {
                    listState.loading = false;
                    listState.items = [];
                    listState.total = 0;
                    listState.hasNext = false;
                    listState.error = err.message || getListText('loadError');
                    renderSubmissionTableState();
                    renderSubmissionMeta();
                    updateListSortHeaders();
                });
        }

        function fetchPlanUsageEstimates() {
            estimatesState.loading = true;
            estimatesState.error = '';
            renderEstimatesTable();

            fetch(API_BASE + '/plan_usage/estimates')
                .then(function(resp) {
                    return resp.json().then(function(data) {
                        return { ok: resp.ok, data: data };
                    });
                })
                .then(function(result) {
                    if (!result.ok || result.data.err_code) {
                        throw new Error(resolveErrorMessage(result.data) || getEstimatesText('loadError'));
                    }
                    var payload = result.data.data;
                    estimatesState.allItems = Array.isArray(payload) ? payload : [];
                    estimatesState.loading = false;
                    estimatesState.error = '';
                    estimatesState.fetched = true;
                    renderEstimatesTable();
                })
                .catch(function(err) {
                    estimatesState.loading = false;
                    estimatesState.allItems = [];
                    estimatesState.error = err.message || getEstimatesText('loadError');
                    estimatesState.fetched = true;
                    renderEstimatesTable();
                });
        }

        function filterEstimatesRows() {
            return estimatesState.allItems.filter(function(row) {
                var sc = Number(row.sample_count);
                if (Number.isFinite(sc) && sc === 0) {
                    return false;
                }
                if (listState.vendorFilter && row.vendor !== listState.vendorFilter) {
                    return false;
                }
                if (listState.planFilter && row.plan !== listState.planFilter) {
                    return false;
                }
                return true;
            });
        }

        function getEstimatePinId(vendor, plan) {
            var vendorName = (vendor || '').trim();
            var planName = (plan || '').trim();
            if (!vendorName || !planName) {
                return '';
            }
            return vendorName + '|' + planName;
        }

        function isEstimatePinned(pinId) {
            return !!pinId && estimatesState.pinnedRowIds.indexOf(pinId) >= 0;
        }

        function togglePinnedEstimateRow(pinId) {
            var index;
            if (!pinId) {
                return;
            }
            index = estimatesState.pinnedRowIds.indexOf(pinId);
            if (index >= 0) {
                estimatesState.pinnedRowIds.splice(index, 1);
            } else {
                estimatesState.pinnedRowIds.push(pinId);
            }
            renderEstimatesTable();
        }

        function handleEstimateTableClick(event) {
            var pinButton = event.target.closest('.estimate-pin-btn');
            if (!pinButton) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();
            togglePinnedEstimateRow(pinButton.getAttribute('data-pin-id') || '');
        }

        function buildEstimateStatusRow(message, kind) {
            var extraClass = kind ? ' ' + kind : '';
            return '<tr class="status-row"><td colspan="6"><div class="status-text' + extraClass + '">' + escapeHtml(message) + '</div></td></tr>';
        }

        function buildEstimateTokenMetricCell(metric) {
            if (metric == null) {
                var dash = getEstimatesText('ciUnavailable');
                return '<td class="numeric-cell estimate-metric-cell">'
                    + '<div class="estimate-median">' + escapeHtml(dash) + '</div>'
                    + '<div class="cell-subtext estimate-ci">' + escapeHtml(dash) + '</div>'
                    + '</td>';
            }
            var m = metric;
            var lo = m.range_lower;
            var hi = m.range_upper;
            var med = m.median;
            var medianStr = formatListTokenAmount(med);
            var ciStr = (Number.isFinite(Number(lo)) && Number.isFinite(Number(hi)))
                ? formatListTokenAmount(lo) + ' – ' + formatListTokenAmount(hi)
                : getEstimatesText('ciUnavailable');
            return '<td class="numeric-cell estimate-metric-cell">'
                + '<div class="estimate-median">' + escapeHtml(medianStr) + '</div>'
                + '<div class="cell-subtext estimate-ci">' + escapeHtml(ciStr) + '</div>'
                + '</td>';
        }

        function findPlanCatalogEntry(vendor, plan) {
            var vendorName = (vendor || '').trim();
            var planName = (plan || '').trim();
            if (!vendorName || !planName) {
                return null;
            }
            for (var i = 0; i < planRows.length; i += 1) {
                var item = planRows[i] || {};
                if ((item.vendor || '').trim() === vendorName && (item.plan || '').trim() === planName) {
                    return item;
                }
            }
            return null;
        }

        function formatPlanPrice(entry) {
            if (!entry) {
                return '-';
            }
            var price = entry.monthlyPrice;
            if (price == null) {
                return '-';
            }
            if (typeof price === 'string') {
                var trimmed = price.trim();
                if (!trimmed || trimmed === '-') {
                    return '-';
                }
                var numericString = Number(trimmed);
                if (!Number.isFinite(numericString)) {
                    return trimmed;
                }
                price = numericString;
            }
            var numericPrice = Number(price);
            if (!Number.isFinite(numericPrice)) {
                return '-';
            }
            var currency = typeof entry.currency === 'string' && entry.currency.trim() ? entry.currency.trim() : '¥';
            return currency + numericPrice.toLocaleString('zh-CN', {
                maximumFractionDigits: 2,
                minimumFractionDigits: numericPrice % 1 === 0 ? 0 : 2
            }) + '/月';
        }

        function buildEstimatePriceCell(vendor, plan) {
            var priceText = formatPlanPrice(findPlanCatalogEntry(vendor, plan));
            return '<td><div class="cell-primary">' + escapeHtml(priceText) + '</div></td>';
        }

        function buildEstimatePinCell(pinId, pinned) {
            var actionLabel = pinned ? getEstimatesText('unpinAction') : getEstimatesText('pinAction');
            return '<td class="estimate-pin-cell"><button class="estimate-pin-btn' + (pinned ? ' is-pinned' : '') + '" type="button" data-pin-id="' + escapeHtml(pinId) + '" aria-pressed="' + (pinned ? 'true' : 'false') + '" title="' + escapeHtml(actionLabel) + '" aria-label="' + escapeHtml(actionLabel) + '"><svg class="estimate-pin-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10.59 1.5c.22 0 .41.14.48.34l.78 2.33 1.87 1.88a.5.5 0 0 1-.35.85h-2.25v3.35a.5.5 0 0 1-.85.35L8.5 8.83 6.73 10.6a.5.5 0 0 1-.85-.35V6.9H3.63a.5.5 0 0 1-.35-.85l1.87-1.88.78-2.33a.5.5 0 0 1 .47-.34h4.19zM7.1 12.22a.5.5 0 0 1 .71 0l.97.97a.5.5 0 0 1-.7.71l-.98-.97a.5.5 0 0 1 0-.71z"></path></svg></button></td>';
        }

        function renderEstimatesTable() {
            var rows;
            var pinnedRows;
            var regularRows;
            var orderedRows;

            if (!estimatesTableBody) {
                return;
            }
            if (estimatesState.loading) {
                estimatesTableBody.innerHTML = buildEstimateStatusRow(getEstimatesText('loading'));
                return;
            }
            if (estimatesState.error) {
                estimatesTableBody.innerHTML = buildEstimateStatusRow(estimatesState.error, 'error');
                return;
            }
            if (!estimatesState.fetched) {
                estimatesTableBody.innerHTML = buildEstimateStatusRow(getEstimatesText('loading'));
                return;
            }
            if (!estimatesState.allItems.length) {
                estimatesTableBody.innerHTML = buildEstimateStatusRow(getEstimatesText('emptyAll'));
                return;
            }

            rows = filterEstimatesRows();
            if (!rows.length) {
                estimatesTableBody.innerHTML = buildEstimateStatusRow(getEstimatesText('emptyFiltered'));
                return;
            }

            pinnedRows = [];
            regularRows = [];
            rows.forEach(function(item) {
                var pinId = getEstimatePinId(item.vendor, item.plan);
                if (isEstimatePinned(pinId)) {
                    pinnedRows.push(item);
                } else {
                    regularRows.push(item);
                }
            });
            orderedRows = pinnedRows.concat(regularRows);

            estimatesTableBody.innerHTML = orderedRows.map(function(item) {
                var sc = Number(item.sample_count);
                var pinId = getEstimatePinId(item.vendor, item.plan);
                var pinned = isEstimatePinned(pinId);
                var sampleLine = formatTemplate(getEstimatesText('sampleCountTemplate'), {
                    n: Number.isFinite(sc) ? formatInteger(sc) : '0'
                });
                return '<tr' + (pinned ? ' class="pinned-row"' : '') + ' data-pin-id="' + escapeHtml(pinId) + '">' 
                    + buildEstimatePinCell(pinId, pinned)
                    + '<td><div class="cell-primary">' + escapeHtml(item.vendor || '') + '</div></td>'
                    + '<td><div class="cell-primary">' + escapeHtml(item.plan || '') + '</div>'
                    + '<div class="cell-subtext">' + escapeHtml(sampleLine) + '</div></td>'
                    + buildEstimatePriceCell(item.vendor, item.plan)
                    + buildEstimateTokenMetricCell(item.read_tokens)
                    + buildEstimateTokenMetricCell(item.write_tokens)
                    + '</tr>';
            }).join('');
        }

        function renderSubmissionMeta() {
            var total = listState.total;
            var start = total ? (listState.page * listState.pageSize) + 1 : 0;
            var end = total ? Math.min(total, (listState.page * listState.pageSize) + listState.items.length) : 0;
            var totalPages = Math.max(1, Math.ceil(total / listState.pageSize));

            listStatsText.textContent = formatTemplate(getListText('totalInfo'), {
                total: total
            });
            listRangeText.textContent = total
                ? formatTemplate(getListText('rangeInfo'), {
                    start: start,
                    end: end,
                    total: total
                })
                : getListText('rangeEmpty');
            paginationText.textContent = formatTemplate(getListText('pageInfo'), {
                page: total ? listState.page + 1 : 1,
                pages: totalPages
            });
            prevPageBtn.disabled = listState.loading || listState.page <= 0;
            nextPageBtn.disabled = listState.loading || !listState.hasNext;
            resetListFiltersBtn.disabled = listState.loading;
            if (listTokenUnitKBtn && listTokenUnitMBtn) {
                listTokenUnitKBtn.disabled = listState.loading;
                listTokenUnitMBtn.disabled = listState.loading;
            }
        }

        function renderSubmissionTableState() {
            if (listState.loading) {
                submissionTableBody.innerHTML = buildStatusRow(getListText('loading'));
                return;
            }
            if (listState.error) {
                submissionTableBody.innerHTML = buildStatusRow(listState.error, 'error');
                return;
            }
            if (!listState.items.length) {
                submissionTableBody.innerHTML = buildStatusRow(getListText('empty'));
                return;
            }

            submissionTableBody.innerHTML = listState.items.map(function(item) {
                var submittedAt = formatTimestamp(item.ctime);
                return '<tr>'
                    + '<td><div class="cell-primary">' + escapeHtml(item.vendor || '') + '</div></td>'
                    + '<td><div class="cell-primary">' + escapeHtml(item.plan || '') + '</div></td>'
                    + '<td class="numeric-cell">' + escapeHtml(formatPercent(item.five_hour_usage_percent)) + '</td>'
                    + '<td class="numeric-cell">' + escapeHtml(formatListTokenAmount(item.read_tokens)) + '</td>'
                    + '<td class="numeric-cell">' + escapeHtml(formatListTokenAmount(item.write_tokens)) + '</td>'
                    + '<td class="numeric-cell">' + escapeHtml(submittedAt) + '</td>'
                    + '</tr>';
            }).join('');
        }

        function buildStatusRow(message, kind) {
            var extraClass = kind ? ' ' + kind : '';
            return '<tr class="status-row"><td colspan="6"><div class="status-text' + extraClass + '">' + escapeHtml(message) + '</div></td></tr>';
        }

        function updateListSortHeaders() {
            Array.prototype.slice.call(submissionTable.querySelectorAll('th.sortable')).forEach(function(header) {
                header.classList.remove('sort-asc', 'sort-desc');
                if (header.getAttribute('data-sort') === listState.sortBy) {
                    header.classList.add(listState.sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        function renderVendorOptions() {
            var seen = {};
            var options = [];
            planRows.forEach(function(item) {
                var vendor = (item.vendor || '').trim();
                if (vendor && !seen[vendor]) {
                    seen[vendor] = true;
                    options.push(vendor);
                }
            });
            vendorOptions.innerHTML = options.sort().map(function(item) {
                var selected = item === selectedVendor ? ' selected' : '';
                return '<button class="multi-select-option single-select-option' + selected + '" type="button" data-value="' + encodeURIComponent(item) + '">' + escapeHtml(item) + '</button>';
            }).join('');
        }

        function syncDependentOptions() {
            var planList = collectPlanOptions(selectedVendor);
            var modelList;
            var selectedModels = getSelectedModelList();
            var disabledPlanSuffix = getFormText('planDisabledOptionSuffix');

            if (selectedPlan && !planList.some(function(item) {
                return item.value === selectedPlan && !item.disabled;
            })) {
                selectedPlan = '';
            }
            if (!selectedVendor) {
                selectedPlan = '';
            }

            planOptions.innerHTML = planList.length ? planList.map(function(item) {
                var selected = item.value === selectedPlan ? ' selected' : '';
                var disabled = item.disabled ? ' disabled aria-disabled="true"' : '';
                var label = item.disabled && disabledPlanSuffix
                    ? item.value + disabledPlanSuffix
                    : item.value;
                return '<button class="multi-select-option single-select-option' + selected + '" type="button" data-value="' + encodeURIComponent(item.value) + '"' + disabled + '>' + escapeHtml(label) + '</button>';
            }).join('') : '<div class="multi-select-empty">' + escapeHtml(getFormText('planDisabledPlaceholder')) + '</div>';

            modelList = selectedVendor && selectedPlan ? collectModelOptions(selectedVendor, selectedPlan) : [];
            selectedModels = selectedModels.filter(function(item) {
                return modelList.indexOf(item) >= 0;
            });

            modelOptions.innerHTML = modelList.length ? modelList.map(function(item, index) {
                var optionId = 'model-option-' + index;
                var checked = selectedModels.indexOf(item) >= 0 ? ' checked' : '';
                return '<label class="multi-select-option" for="' + optionId + '">'
                    + '<input type="checkbox" id="' + optionId + '" value="' + escapeHtml(item) + '"' + checked + '>'
                    + '<span>' + escapeHtml(item) + '</span>'
                    + '</label>';
            }).join('') : '<div class="multi-select-empty">' + escapeHtml(getFormText('modelEmpty')) + '</div>';

            Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]')).forEach(function(checkbox) {
                checkbox.addEventListener('change', updateModelLabel);
            });

            updateSelectionLabels();
            updateModelLabel();
        }

        function collectPlanOptions(vendor) {
            var seen = {};
            return planRows
                .filter(function(item) {
                    return !vendor || (item.vendor || '').trim() === vendor;
                })
                .map(function(item) {
                    return {
                        value: (item.plan || '').trim(),
                        disabled: (item.type || '').trim() !== 'Coding Plan'
                    };
                })
                .filter(function(item) {
                    if (!item.value || seen[item.value]) return false;
                    seen[item.value] = true;
                    return true;
                })
                .sort(function(a, b) {
                    if (a.disabled !== b.disabled) {
                        return a.disabled ? 1 : -1;
                    }
                    return a.value.localeCompare(b.value, 'zh-CN');
                });
        }

        function collectModelOptions(vendor, plan) {
            var seen = {};
            var rows = planRows.filter(function(item) {
                var vendorMatch = !vendor || (item.vendor || '').trim() === vendor;
                var planMatch = !plan || (item.plan || '').trim() === plan;
                return vendorMatch && planMatch;
            });
            var modelOptions = rows
                .flatMap(function(item) { return Array.isArray(item.models) ? item.models : []; })
                .map(function(item) { return String(item || '').trim(); })
                .filter(function(item) {
                    if (!item || seen[item]) return false;
                    seen[item] = true;
                    return true;
                })
                .sort();

            var otherOption = getFormText('modelOtherOption');
            if (otherOption && !seen[otherOption]) {
                modelOptions.push(otherOption);
            }

            return modelOptions;
        }

        function getSelectedModelList() {
            return Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]:checked'))
                .map(function(option) { return String(option.value || '').trim(); })
                .filter(function(item) { return item.length > 0; });
        }

        function updateSelectionLabels() {
            if (selectedVendor) {
                vendorInputLabel.textContent = selectedVendor;
                vendorInputLabel.classList.remove('placeholder');
            } else {
                vendorInputLabel.textContent = getFormText('vendorPlaceholder');
                vendorInputLabel.classList.add('placeholder');
            }

            if (selectedPlan) {
                planInputLabel.textContent = selectedPlan;
                planInputLabel.classList.remove('placeholder');
            } else if (!selectedVendor) {
                planInputLabel.textContent = getFormText('planDisabledPlaceholder');
                planInputLabel.classList.add('placeholder');
            } else {
                planInputLabel.textContent = getFormText('planPlaceholder');
                planInputLabel.classList.add('placeholder');
            }

            planInput.disabled = !selectedVendor;
            modelInput.disabled = !selectedVendor || !selectedPlan;
        }

        function updateModelLabel() {
            var selectedModels = getSelectedModelList();
            if (!selectedModels.length) {
                if (!selectedVendor) {
                    modelInputLabel.textContent = getFormText('modelDisabledVendorPlaceholder');
                } else if (!selectedPlan) {
                    modelInputLabel.textContent = getFormText('modelDisabledPlanPlaceholder');
                } else {
                    modelInputLabel.textContent = getFormText('modelPlaceholder');
                }
                modelInputLabel.classList.add('placeholder');
                return;
            }
            modelInputLabel.textContent = selectedModels.join('，');
            modelInputLabel.classList.remove('placeholder');
        }

        function toggleDropdown(event, selectRoot, trigger, panel, isDisabled) {
            event.preventDefault();
            if (isDisabled) {
                return;
            }
            if (selectRoot.classList.contains('open')) {
                closeDropdown(selectRoot, trigger, panel);
                return;
            }
            closeAllDropdowns();
            selectRoot.classList.add('open');
            panel.hidden = false;
            trigger.setAttribute('aria-expanded', 'true');
        }

        function closeDropdown(selectRoot, trigger, panel) {
            selectRoot.classList.remove('open');
            panel.hidden = true;
            trigger.setAttribute('aria-expanded', 'false');
        }

        function closeAllDropdowns() {
            closeDropdown(vendorSelect, vendorInput, vendorOptionsPanel);
            closeDropdown(planSelect, planInput, planOptionsPanel);
            closeDropdown(modelSelect, modelInput, modelOptionsPanel);
            closeDropdown(listVendorSelect, listVendorInput, listVendorOptionsPanel);
            closeDropdown(listPlanSelect, listPlanInput, listPlanOptionsPanel);
        }

        function handleDocumentClick(event) {
            var lb = fieldHelpLightboxEl || document.getElementById('fieldHelpImageLightbox');
            if (lb && !lb.hidden && lb.contains(event.target)) {
                return;
            }

            if (!vendorSelect.contains(event.target)
                && !planSelect.contains(event.target)
                && !modelSelect.contains(event.target)
                && !listVendorSelect.contains(event.target)
                && !listPlanSelect.contains(event.target)) {
                closeAllDropdowns();
            }

            if (openFieldHelpWrap && !openFieldHelpWrap.contains(event.target)) {
                closeFieldHelp(openFieldHelpWrap);
            }
        }

        function handleVendorSelect(event) {
            var option = event.target.closest('.single-select-option');
            if (!option) {
                return;
            }
            selectedVendor = decodeURIComponent(option.getAttribute('data-value') || '');
            selectedPlan = '';
            closeAllDropdowns();
            syncDependentOptions();
        }

        function handlePlanSelect(event) {
            var option = event.target.closest('.single-select-option');
            if (!option || !selectedVendor || option.disabled) {
                return;
            }
            selectedPlan = decodeURIComponent(option.getAttribute('data-value') || '');
            closeAllDropdowns();
            syncDependentOptions();
        }

        function selectAllModels() {
            Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]')).forEach(function(checkbox) {
                checkbox.checked = true;
            });
            updateModelLabel();
        }

        function clearSelectedModels() {
            Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]')).forEach(function(checkbox) {
                checkbox.checked = false;
            });
            updateModelLabel();
        }

        function parseKTokenInput(inputId) {
            var value = Number(document.getElementById(inputId).value);
            if (!Number.isFinite(value) || value < 0) {
                return 0;
            }
            return Math.round(value * 1000);
        }

        function formatWindowStartInput(inputId) {
            var value = String(document.getElementById(inputId).value || '').trim();
            if (!value) {
                return '';
            }

            var parts = value.split('T');
            if (parts.length !== 2) {
                return value;
            }

            var datePart = parts[0].replace(/-/g, '');
            var timePart = parts[1];
            if (/^\d{2}:\d{2}$/.test(timePart)) {
                timePart += ':00';
            }

            return datePart + ' ' + timePart;
        }

        function getFormText(key) {
            if (pageContent && pageContent.form && typeof pageContent.form[key] === 'string') {
                return pageContent.form[key];
            }
            return '';
        }

        function getListText(key) {
            if (pageContent && pageContent.list && typeof pageContent.list[key] === 'string') {
                return pageContent.list[key];
            }
            return '';
        }

        function getEstimatesText(key) {
            if (pageContent && pageContent.estimates && typeof pageContent.estimates[key] === 'string') {
                return pageContent.estimates[key];
            }
            return '';
        }

        function getMessage(key) {
            if (pageContent && pageContent.messages && typeof pageContent.messages[key] === 'string') {
                return pageContent.messages[key];
            }
            return '';
        }

        function setText(id, value) {
            var element = document.getElementById(id);
            if (element) {
                element.textContent = value;
            }
        }

        function setPlaceholder(id, value) {
            var element = document.getElementById(id);
            if (element) {
                element.setAttribute('placeholder', value);
            }
        }

        function setButtonA11yText(id, value) {
            var element = document.getElementById(id);
            if (element) {
                element.setAttribute('title', value);
                element.setAttribute('aria-label', value);
            }
        }

        function resolveErrorMessage(payload) {
            if (!payload) return getMessage('submitGeneric');
            if (payload.err_msg) return payload.err_msg;
            if (payload.validation_error) {
                if (payload.validation_error.body_params && payload.validation_error.body_params[0]) {
                    return payload.validation_error.body_params[0].msg;
                }
                if (payload.validation_error.query_params && payload.validation_error.query_params[0]) {
                    return payload.validation_error.query_params[0].msg;
                }
            }
            return getMessage('submitGeneric');
        }

        function showResult(kind, title, message, metaItems) {
            resultCard.className = 'result-card ' + kind;
            resultCard.style.display = 'block';
            resultTitle.textContent = title;
            resultBody.textContent = message;
            resultMeta.innerHTML = (metaItems || []).map(function(item) {
                return '<span class="meta-pill">' + escapeHtml(item) + '</span>';
            }).join('');
        }

        function showToast(kind, title, message) {
            if (!toastStack) {
                return;
            }

            var toast = toastStack.querySelector('.toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = '<div class="toast-title"></div><div class="toast-body"></div>';
                toastStack.appendChild(toast);
            }

            toast.className = 'toast ' + kind;
            toast.querySelector('.toast-title').textContent = title;
            toast.querySelector('.toast-body').textContent = message;

            if (successToastTimer) {
                window.clearTimeout(successToastTimer);
            }

            window.requestAnimationFrame(function() {
                toast.classList.add('visible');
            });

            successToastTimer = window.setTimeout(function() {
                toast.classList.remove('visible');
            }, 2600);
        }

        function emphasizeResultCard() {
            if (!resultCard) {
                return;
            }

            if (resultFlashTimer) {
                window.clearTimeout(resultFlashTimer);
            }

            resultCard.classList.remove('flash-success');
            scrollResultIntoView();

            window.requestAnimationFrame(function() {
                resultCard.classList.add('flash-success');
                resultFlashTimer = window.setTimeout(function() {
                    resultCard.classList.remove('flash-success');
                }, 1800);
            });
        }

        function scrollResultIntoView() {
            if (!resultCard || resultCard.style.display === 'none') {
                return;
            }

            var rect = resultCard.getBoundingClientRect();
            var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
            if (rect.top >= 72 && rect.bottom <= viewportHeight - 24) {
                return;
            }

            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function formatPercent(value) {
            var numericValue = Number(value);
            if (!Number.isFinite(numericValue)) {
                return '-';
            }
            return numericValue.toFixed(2) + '%';
        }

        function formatInteger(value) {
            var numericValue = Number(value);
            if (!Number.isFinite(numericValue)) {
                return '-';
            }
            return Math.round(numericValue).toLocaleString('zh-CN');
        }

        function formatListTokenAmount(rawTokens) {
            var n = Number(rawTokens);
            if (!Number.isFinite(n)) {
                return '-';
            }
            if (listTokenUnit === 'm') {
                return (n / 1000000).toLocaleString('zh-CN', { maximumFractionDigits: 6, minimumFractionDigits: 0 });
            }
            return (n / 1000).toLocaleString('zh-CN', { maximumFractionDigits: 3, minimumFractionDigits: 0 });
        }

        function refreshListTokenColumnHeaders() {
            var suffix = listTokenUnit === 'm' ? 'M' : 'K';
            setText('recordsReadTokensHeading', getListText('tableReadTokens' + suffix));
            setText('recordsWriteTokensHeading', getListText('tableWriteTokens' + suffix));
            if (listTokenUnitKBtn) {
                listTokenUnitKBtn.classList.toggle('active', listTokenUnit === 'k');
                listTokenUnitKBtn.setAttribute('aria-pressed', listTokenUnit === 'k' ? 'true' : 'false');
            }
            if (listTokenUnitMBtn) {
                listTokenUnitMBtn.classList.toggle('active', listTokenUnit === 'm');
                listTokenUnitMBtn.setAttribute('aria-pressed', listTokenUnit === 'm' ? 'true' : 'false');
            }
            refreshEstimatesTokenHeaders();
        }

        function refreshEstimatesTokenHeaders() {
            var suffix = listTokenUnit === 'm' ? 'M' : 'K';
            setText('estimatesReadTokensHeading', getEstimatesText('tableReadTokens' + suffix));
            setText('estimatesWriteTokensHeading', getEstimatesText('tableWriteTokens' + suffix));
        }

        function handleListTokenUnitClick(unit) {
            var next = unit === 'm' ? 'm' : 'k';
            if (listState.loading || next === listTokenUnit) {
                return;
            }
            listTokenUnit = next;
            try {
                localStorage.setItem(LIST_TOKEN_UNIT_STORAGE, listTokenUnit);
            } catch (e) {
                /* ignore */
            }
            refreshListTokenColumnHeaders();
            renderSubmissionTableState();
            renderEstimatesTable();
        }

        /** 将 Unix 时间戳格式化为本地时区的 YYYY-MM-DD HH:mm（精确到分钟）。 */
        function formatTimestamp(value) {
            var numericValue = Number(value);
            if (!Number.isFinite(numericValue) || numericValue <= 0) {
                return '-';
            }

            var millis = numericValue > 1000000000000 ? numericValue : numericValue * 1000;
            var date = new Date(millis);
            if (Number.isNaN(date.getTime())) {
                return '-';
            }

            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var hours = String(date.getHours()).padStart(2, '0');
            var minutes = String(date.getMinutes()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
        }

        function formatTemplate(template, params) {
            return String(template || '').replace(/\{(\w+)\}/g, function(match, key) {
                if (Object.prototype.hasOwnProperty.call(params, key)) {
                    return String(params[key]);
                }
                return match;
            });
        }

    })();
    </script>

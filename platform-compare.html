<head>

</head>
<body class="platform-comparison-page">

<!-- SITE_NAV_START -->
<header class="tool-topbar site-header">
  <a class="tool-brand" href="/" aria-label="Coding Plan 首页"><span class="tool-brand-name">Coding Plan</span></a>
  <nav class="tool-nav" aria-label="主导航">
    <a href="/">首页</a>
    <a href="/platforms/" aria-current="page">平台</a>
    <a href="/models/">模型</a>
    <a href="/pricing/">价格与额度</a>
    <a href="/plans/">套餐</a>
    <a href="/monitor/" hidden data-monitor-nav>可用性监控</a>
    <a href="/articles/">文章</a>
    <a href="/updates/">更新历史</a>
  </nav>
  <div id="settingsMount">
    <div class="settings-wrapper">
      <button type="button" class="settings-btn" id="settingsBtn" title="显示设置" aria-label="显示设置" aria-expanded="false" aria-controls="settingsPanel" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <div class="settings-panel" id="settingsPanel" hidden aria-label="显示设置">
        <div class="settings-unit-section">
          <div class="settings-unit-heading" id="tokenUnitLabel">Token 单位</div>
          <div class="settings-unit-options" role="group" aria-labelledby="tokenUnitLabel">
            <button type="button" data-settings-token-unit="yi" aria-pressed="true">亿 Token</button>
            <button type="button" data-settings-token-unit="M" aria-pressed="false">M Token</button>
            <button type="button" data-settings-token-unit="B" aria-pressed="false">B Token</button>
          </div>
        </div>
        <div class="settings-toggle-row">
          <label for="ultraWideToggle">超宽屏</label>
          <label class="toggle-switch">
            <input type="checkbox" id="ultraWideToggle" aria-label="超宽屏">
            <span class="toggle-slider" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- SITE_NAV_END -->
<main class="container platform-comparison-container">
        <nav class="platform-comparison-breadcrumb" aria-label="面包屑">
            <a href="/platforms/">平台中心</a>
            <span aria-hidden="true">/</span>
            <span>平台横向对比</span>
        </nav>

        <header class="platform-comparison-hero">
            <div>
                <p class="platform-comparison-kicker">PLATFORM COMPARE</p>
                <h1>把候选平台放在一张桌上</h1>
                <p>先看购买门槛、模型能力与稳定性，再决定值得深入研究哪些套餐。</p>
            </div>
            <button type="button" class="platform-comparison-secondary-btn" id="platformComparisonChoose">重新选择</button>
        </header>

        <div class="platform-comparison-loading" id="platformComparisonLoading" role="status">正在整理平台信息…</div>
        <div class="platform-comparison-error" id="platformComparisonError" hidden></div>

        <section id="platformComparisonApp" hidden>
            <div class="platform-comparison-selection-wrap" aria-label="当前对比平台">
                <div class="platform-comparison-selection" id="platformComparisonSelection"></div>
            </div>

            <section class="platform-comparison-summary" aria-labelledby="platformComparisonSummaryTitle">
                <div class="platform-comparison-section-heading">
                    <div>
                        <p class="platform-comparison-eyebrow">一屏决策摘要</p>
                        <h2 id="platformComparisonSummaryTitle">先看谁在哪方面占优</h2>
                    </div>
                    <p>领先仅针对当前所选平台，不代表所有场景下的总排名。</p>
                </div>
                <div class="platform-comparison-summary-grid" id="platformComparisonSummary"></div>
            </section>

            <section class="platform-comparison-details" aria-labelledby="platformComparisonDetailsTitle">
                <div class="platform-comparison-toolbar">
                    <div>
                        <p class="platform-comparison-eyebrow">详细对比</p>
                        <h2 id="platformComparisonDetailsTitle">关键差异与选择依据</h2>
                    </div>
                    <label class="platform-comparison-diff-toggle">
                        <input type="checkbox" id="platformComparisonOnlyDifferences">
                        <span aria-hidden="true"></span>
                        只看差异
                    </label>
                </div>
                <p class="platform-comparison-focus-hint" id="platformComparisonFocusHint">点每行左侧的书签，可把最关心的指标置顶。</p>
                <div class="platform-comparison-matrix-wrap">
                    <div class="platform-comparison-matrix" id="platformComparisonMatrix"></div>
                </div>
            </section>

            <footer class="platform-comparison-footer">
                <div>
                    <strong>平台只是第一层选择</strong>
                    <p>确认候选后，可回到套餐表继续核对价格、额度和具体模型。</p>
                </div>
                <a href="/plans/" class="platform-comparison-primary-link">查看套餐对比 <span aria-hidden="true">→</span></a>
            </footer>
        </section>
    </main>

    <script src="scripts/entity-data.js?v=261009harness"></script>
    <script src="scripts/platform-pages.js?v=b5b0ec3644"></script>
    <script src="scripts/platform-catalog.js?v=261009harness"></script>
    <script src="/scripts/number-display.js?v=261010numbers"></script>
<script src="scripts/platform-comparison.js?v=261010numbers"></script>
    <script>
        PlatformComparison.bootComparePage();
    </script>
</body>
</html>
